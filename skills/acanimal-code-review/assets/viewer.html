          ].join("\n"));
          h += "</div>";
          h += '<div class="sec"><h2>Reading findings</h2>';
          h += md([
            "Each finding is a comment raised during a review, with:",
            "",
            "- **Severity** — `critical` (breaks production, data loss, security issue, crash) and `major` (real bug or required-standard violation) block the commit; `minor` (recommended-standard violation) and `nitpick` (preference-standard violation) do not.",
            "- **Category** — `bug`, `security`, `performance`, `maintainability`, `style`, `docs`, `tests`, `architecture`, `other`.",
            "- **Standard** — linked `STD-xxxx` when the finding violates a project standard; see the Standards tab.",
            "- **Location** — repo-relative file and line range, in the current version of the file.",
            "- **Suggested change** — unified diff (`-` / `+`) when the fix is local and confident.",
            "- **🤖 Prompt for AI agents** — self-contained instruction to hand over to another coding agent; use the copy button to grab it.",
          ].join("\n"));
          h += "</div>";
          h += '<div class="sec"><h2>Acting on findings</h2>';
          h += md([
            "Findings carry an ID like `ACR-1a2b3c`. Typical requests:",
            "",
            "- **Explain** `ACR-1a2b3c` — the agent reads the code and answers in chat; no data change.",
            "- **Fix** `ACR-1a2b3c`, “fix the blockers”, “apply the suggestions” — the agent shows the proposed change (diff) and asks for confirmation; only what is confirmed is applied, then the branch is re-reviewed.",
            "- **Dismiss** `ACR-1a2b3c` — mark as not applicable, with a required reason.",
            "- **Exception** — “`ACR-1a2b3c` is fine in `src/legacy/`”, “ignore `STD-1a2b` here” — adds a time-boxed exception (path, reason, optional expiry).",
          ].join("\n"));
          h += "</div>";
          h += '<div class="sec"><h2>Managing standards</h2>';
          h += md([
            "The standards catalog is stored in `.code-review/` and managed through the agent: proposed standards are not enforced until validated; levels map to severities (`required` → `major`, `recommended` → `minor`, `preference` → `nitpick`).",
            "",
            "Typical requests: “show pending standards”, “in this project we do Y” (record or change a standard), “deprecate `STD-1a2b` in favour of `STD-9f8e`” (with migration tracking).",
          ].join("\n"));
          h += "</div>";
          h += '<div class="sec"><h2>Quick reference</h2>';
          h += md([
            "```",
            "CRR init                         create/upgrade .code-review/",
            "CRR context [--mode auto|pending|full|branch]   resolve the diff to review",
            "CRR apply <run.json>             record a review or a status change",
            "CRR std <ops.json>                manage standards / exceptions",
            "CRR list | CRR show <ID> | CRR standards   read data",
            "CRR config [--language xx] [--base REF] [--check ID --enabled|--blocking true|false]",
            "CRR repo-stats                   repo size / standards analysis",
            "CRR index                         rebuild the panel index",
            "```",
          ].join("\n"));
          h +=
            '<p class="small muted">Full command list and file formats: <code>scripts/crr.py --help</code>, <code>references/run-schema.md</code> and <code>references/standards.md</code>.</p>';
          h += "</div>";
          return h;
        }

        // ---------------------------------------------------------------- router
        function route() {
          var hash = location.hash.replace(/^#\/?/, ""),
            q = "";
          if (hash.indexOf("?") >= 0) {
            q = hash.slice(hash.indexOf("?") + 1);
            hash = hash.slice(0, hash.indexOf("?"));
          }
          var parts = hash.split("/").map(decodeURIComponent),
            v = parts[0] || "home";
          COPY = {};
          var html;
          if (v === "branch") html = viewBranch(parts[1]);
          else if (v === "standards")
            html = viewStandards(parts[1], (/(?:^|&)f=(\w+)/.exec(q) || [])[1]);
          else if (v === "insights") html = viewInsights();
          else if (v === "help") html = viewHelp();
          else {
            v = "home";
            html = viewHome();
          }
          app.innerHTML = html;
          document.querySelectorAll("#nav a").forEach(function (a) {
            a.classList.toggle("on", a.dataset.v === v);
          });
          if (v !== "standards" || !parts[1]) window.scrollTo(0, 0);
          renderMermaid();
        }
        var mermaidP = null;
        function renderMermaid() {
          var els = document.querySelectorAll("pre.mermaid");
          if (!els.length) return;
          if (!mermaidP)
            mermaidP = new Promise(function (ok, ko) {
              var s = document.createElement("script");
              s.src =
                "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
              s.onload = function () {
                ok(window.mermaid);
              };
              s.onerror = ko;
              document.head.appendChild(s);
            });
          mermaidP
            .then(function (m) {
              var dark =
                getComputedStyle(document.documentElement).colorScheme ===
                "dark";
              m.initialize({
                startOnLoad: false,
                theme: dark ? "dark" : "default",
                securityLevel: "strict",
              });
              m.run({ nodes: document.querySelectorAll("pre.mermaid") });
            })
            .catch(function () {
              /* offline: the diagram source stays visible */
            });
        }

        document.addEventListener("click", function (e) {
          var t = e.target.closest("[data-copy]");
          if (t) {
            copyText(COPY[t.dataset.copy] || "", t);
            return;
          }
          var tr = e.target.closest("tr[data-href]");
          if (tr && !e.target.closest("a")) {
            location.hash = tr.dataset.href;
            return;
          }
          var f = e.target.closest(".chip[data-f]");
          if (f) {
            document.querySelectorAll(".chip[data-f]").forEach(function (c) {
              c.classList.toggle("on", c === f);
            });
            var sev = f.dataset.f;
            document
              .querySelectorAll("#comments details.cmt")
              .forEach(function (d) {
                d.classList.toggle(
                  "hidden",
                  sev !== "all" && d.dataset.sev !== sev,
                );
              });
            document
              .querySelectorAll("#comments h3.file")
              .forEach(function (h) {
                var n = h.nextElementSibling,
                  any = false;
                while (n && n.matches("details.cmt")) {
                  if (!n.classList.contains("hidden")) any = true;
                  n = n.nextElementSibling;
                }
                h.classList.toggle("hidden", !any);
              });
            return;
          }
          var sf = e.target.closest(".chip[data-sf]");
          if (sf) {
            applyStdFilter(sf.dataset.sf);
            return;
          }
          var hs = e.target.closest(".chip[data-hs]");
          if (hs) {
            document.querySelectorAll(".chip[data-hs]").forEach(function (c) {
              c.classList.toggle("on", c === hs);
            });
            document
              .getElementById("hs-dirs")
              .classList.toggle("hidden", hs.dataset.hs !== "dirs");
            document
              .getElementById("hs-files")
              .classList.toggle("hidden", hs.dataset.hs !== "files");
          }
        });
        document.addEventListener("input", function (e) {
          if (e.target.id === "sq" || e.target.id === "scat") {
            var on = document.querySelector(".chip[data-sf].on");
            applyStdFilter(on ? on.dataset.sf : "all");
          }
        });
        window.addEventListener("hashchange", route);

        loadAll(function () {
          if (CRR.local && CRR.local.repo) {
            document.getElementById("brand").innerHTML =
              "Code review <span>· " + esc(CRR.local.repo) + "</span>";
            document.title = "Code Review · " + CRR.local.repo;
          }
          route();
        });
      })();
    </script>
  </body>
</html>
