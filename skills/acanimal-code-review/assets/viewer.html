<!doctype html>
<!-- acanimal-code-review viewer v2 (experimental layout). Static file: never edited per review. Data comes from ./data/*.js -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Review Panel</title>
    <style>
      :root {
        --bg: #f6f6f3;
        --panel: #fff;
        --ink: #1b1c1e;
        --muted: #6a6e75;
        --line: #e3e3de;
        --soft: #f0f0ec;
        --accent: #d9480f;
        --add: #e7f6eb;
        --add-ink: #17733a;
        --del: #fdeceb;
        --del-ink: #b42318;
        --hunk: #eef1fb;
        --critical: #d92d20;
        --major: #e8590c;
        --minor: #b7860b;
        --nitpick: #64748b;
        --ok: #15803d;
        --info: #2563eb;
        --c1: #2563eb;
        --c2: #d9480f;
        --c3: #0f9d76;
        --c4: #9333ea;
        --c5: #b7860b;
        --c6: #64748b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121315;
          --panel: #1a1b1e;
          --ink: #e7e7e4;
          --muted: #9b9fa6;
          --line: #2b2d31;
          --soft: #222429;
          --accent: #ff8a3d;
          --add: #11301c;
          --add-ink: #62d483;
          --del: #3a1513;
          --del-ink: #ff8c82;
          --hunk: #1d2240;
          --critical: #ff6b5e;
          --major: #ff8a3d;
          --minor: #f2c94c;
          --nitpick: #9aa5b5;
          --ok: #4ade80;
          --info: #7aa2ff;
          --c1: #7aa2ff;
          --c2: #ff8a3d;
          --c3: #3ddbb0;
          --c4: #c084fc;
          --c5: #f2c94c;
          --c6: #9aa5b5;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121315;
        --panel: #1a1b1e;
        --ink: #e7e7e4;
        --muted: #9b9fa6;
        --line: #2b2d31;
        --soft: #222429;
        --accent: #ff8a3d;
        --add: #11301c;
        --add-ink: #62d483;
        --del: #3a1513;
        --del-ink: #ff8c82;
        --hunk: #1d2240;
        --critical: #ff6b5e;
        --major: #ff8a3d;
        --minor: #f2c94c;
        --nitpick: #9aa5b5;
        --ok: #4ade80;
        --info: #7aa2ff;
        --c1: #7aa2ff;
        --c2: #ff8a3d;
        --c3: #3ddbb0;
        --c4: #c084fc;
        --c5: #f2c94c;
        --c6: #9aa5b5;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14.5px/1.55 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code,
      pre,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      :not(pre) > code {
        background: var(--soft);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .sec {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        margin: 14px 0;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12.5px;
      }
      .n {
        background: var(--soft);
        color: var(--muted);
        border-radius: 999px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        border-radius: 5px;
        padding: 2px 7px;
        background: var(--soft);
        white-space: nowrap;
      }
      .sev-critical {
        color: var(--critical);
      }
      .sev-major {
        color: var(--major);
      }
      .sev-minor {
        color: var(--minor);
      }
      .sev-nitpick {
        color: var(--nitpick);
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--critical);
      }
      .warn {
        color: var(--major);
      }
      .verdict {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        font-weight: 600;
        border: 1px solid var(--line);
      }
      .verdict.ready {
        background: color-mix(in srgb, var(--ok) 12%, var(--panel));
      }
      .verdict.blocked {
        background: color-mix(in srgb, var(--critical) 11%, var(--panel));
      }
      .verdict .big {
        font-size: 18px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        vertical-align: top;
        padding: 9px 8px;
        border-top: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 600;
        border-top: 0;
      }
      tr.click {
        cursor: pointer;
      }
      tr.click:hover td {
        background: var(--soft);
      }
      tr.current td {
        background: color-mix(in srgb, var(--accent) 8%, var(--panel));
      }
      .scroll {
        overflow-x: auto;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0 10px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .chip.on {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 7px;
        padding: 5px 10px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .btn:hover,
      .chip:hover {
        border-color: var(--accent);
      }
      details.cmt {
        border: 1px solid var(--line);
        border-left: 4px solid var(--nitpick);
        border-radius: 8px;
        margin: 8px 0;
        background: var(--panel);
      }
      details.cmt.s-critical {
        border-left-color: var(--critical);
      }
      details.cmt.s-major {
        border-left-color: var(--major);
      }
      details.cmt.s-minor {
        border-left-color: var(--minor);
      }
      details > summary {
        cursor: pointer;
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      details.cmt > summary {
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .ct {
        font-weight: 600;
        flex: 1 1 260px;
      }
      .loc {
        color: var(--muted);
        font-size: 12px;
        word-break: break-all;
      }
      .cid {
        color: var(--muted);
        font-size: 11px;
      }
      .cb {
        padding: 2px 14px 12px;
        border-top: 1px solid var(--line);
      }
      .lbl {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        margin: 10px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      pre.code,
      pre.diff {
        background: var(--soft);
        border-radius: 8px;
        padding: 9px 12px;
        overflow-x: auto;
        margin: 6px 0;
        white-space: pre;
      }
      pre.diff {
        padding: 7px 0;
      }
      pre.diff span {
        display: block;
        padding: 0 12px;
      }
      pre.diff .a {
        background: var(--add);
        color: var(--add-ink);
      }
      pre.diff .d {
        background: var(--del);
        color: var(--del-ink);
      }
      pre.diff .h {
        background: var(--hunk);
        color: var(--muted);
      }
      h3.file {
        display: flex;
        gap: 8px;
        align-items: center;
        word-break: break-all;
        margin: 16px 0 6px;
      }
      .group > summary h2 {
        margin: 0;
      }
      .group[open] > summary {
        margin-bottom: 8px;
      }
      ul.clean {
        list-style: none;
        padding: 0;
        margin: 6px 0;
      }
      ul.clean li {
        padding: 4px 0;
      }
      .alert {
        border: 1px solid color-mix(in srgb, var(--major) 28%, var(--line));
        padding: 8px 12px;
        background: color-mix(in srgb, var(--major) 6%, var(--panel));
        border-radius: 8px;
        margin: 6px 0;
      }
      .alert.info {
        border-color: var(--line);
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .alert.info .ico {
        color: var(--minor);
        flex: none;
        position: relative;
        top: 2px;
      }
      .tl {
        border-left: 2px solid var(--line);
        margin: 4px 0 0 6px;
        padding-left: 14px;
      }
      .tl .ev {
        position: relative;
        padding: 4px 0 10px;
      }
      .tl .ev:before {
        content: "";
        position: absolute;
        left: -20px;
        top: 9px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
      }
      .tl .ev.ready:before {
        background: var(--ok);
      }
      .tl .ev.blocked:before {
        background: var(--critical);
      }
      .hbar {
        display: grid;
        grid-template-columns: minmax(90px, 38%) 1fr 44px;
        gap: 8px;
        align-items: center;
        margin: 5px 0;
        font-size: 13px;
      }
      .hbar .lab {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hbar .track {
        background: var(--soft);
        border-radius: 4px;
        height: 10px;
        overflow: hidden;
        display: flex;
      }
      .hbar .fill {
        height: 100%;
      }
      .hbar .val {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin: 4px 0 8px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .kpi b {
        display: block;
        font-size: 24px;
        line-height: 1.1;
        margin-top: 2px;
      }
      .std {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin: 8px 0;
        background: var(--panel);
      }
      .std .head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .std .t {
        font-weight: 600;
      }
      input.search,
      select {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 7px;
        padding: 6px 9px;
        font: inherit;
        font-size: 13px;
      }
      .empty {
        color: var(--muted);
        padding: 6px 0;
      }
      .hidden {
        display: none !important;
      }
      svg text {
        fill: var(--muted);
        font-size: 10px;
      }
      /* ------------------------------------------------------------ v2 layout */
      :root {
        --sel: color-mix(in srgb, var(--accent) 7%, var(--panel));
        --side: color-mix(in srgb, var(--ink) 3%, var(--bg));
      }
      h1 {
        font-size: 21px;
        margin: 0;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      h3 {
        font-size: 13.5px;
        margin: 16px 0 8px;
      }
      h2.sub {
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 28px 0 10px;
      }
      h2.sub:first-child {
        margin-top: 4px;
      }
      .meta {
        color: var(--muted);
        font-size: 12.5px;
        margin: 4px 0 14px;
      }
      .shell {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: 100vh;
      }
      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: var(--side);
        padding: 14px 10px 24px;
      }
      .side .brand {
        display: block;
        padding: 4px 10px 12px;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .side .brand span {
        display: block;
        font-weight: 500;
        color: var(--muted);
        font-size: 12.5px;
      }
      .side .brand:hover {
        text-decoration: none;
      }
      .side-h {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 14px 10px 6px;
      }
      .side .bl,
      .side .pl {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 7px;
        color: var(--ink);
        font-size: 13.5px;
        min-width: 0;
      }
      .side a.bl:hover,
      .side a.pl:hover {
        background: var(--soft);
        text-decoration: none;
      }
      .side a.on {
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--line);
        font-weight: 600;
      }
      .bl .bn {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      .pl .bn2 {
        flex: 1;
      }
      .bl.hist {
        opacity: 0.6;
      }
      .bl .cur {
        font-size: 10.5px;
        color: var(--accent);
        font-weight: 600;
      }
      .bl.ghost .cur {
        color: var(--muted);
      }
      .bc {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .bc.warn {
        color: var(--info);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        box-shadow: inset 0 0 0 1.5px var(--muted);
      }
      .dot.blocked {
        background: var(--critical);
        box-shadow: none;
      }
      .dot.ready {
        background: var(--ok);
        box-shadow: none;
      }
      .side-empty {
        color: var(--muted);
        font-size: 12.5px;
        padding: 4px 10px;
        margin: 0;
      }
      .mtop {
        display: none;
      }
      #app {
        max-width: 1040px;
        width: 100%;
        padding: 22px 32px 96px;
        margin: 0 auto;
      }
      .galerts {
        margin-bottom: 16px;
        font-size: 13px;
      }

      ::selection {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
      }
      html {
        scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent)
          transparent;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      a {
        text-underline-offset: 2px;
      }
      .ico {
        width: 1em;
        height: 1em;
        vertical-align: -0.125em;
        flex: none;
      }
      .verdict .vi {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        flex: none;
        font-size: 15px;
        color: var(--panel);
        background: var(--muted);
      }
      .verdict.blocked .vi {
        background: var(--critical);
      }
      .verdict.ready .vi {
        background: var(--ok);
      }
      .verdict.none .vi {
        background: none;
        box-shadow: inset 0 0 0 1.5px var(--muted);
      }
      .ckic.ok,
      .ckic.bad,
      .ckic.warn,
      .ckic.muted {
        display: inline-grid;
        place-items: center;
        width: 18px;
        font-weight: 700;
      }
      .checklist.alldone {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .checklist.alldone .ic {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--ok);
        color: var(--panel);
        font-size: 12px;
        flex: none;
      }
      .checklist.alldone b {
        color: var(--ink);
      }

      /* branch header */
      .bh-top {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .bh h1 code {
        background: none;
        padding: 0;
        font-size: 19px;
      }
      .badge.cur-b {
        color: var(--accent);
      }
      .verdict {
        align-items: flex-start;
      }
      .verdict.none {
        color: var(--muted);
      }
      .verdict .vt {
        font-size: 15px;
      }
      .verdict .vs {
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 400;
      }
      .bks {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .bk {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .bk:hover {
        border-color: var(--accent);
        text-decoration: none;
      }
      details.commit {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }
      details.commit > summary {
        padding: 8px 12px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .lbl3 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        white-space: nowrap;
      }
      .cm1 {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .withcopy {
        position: relative;
      }
      .withcopy > [data-copy] {
        position: absolute;
        top: 6px;
        right: 8px;
      }
      .withcopy > details > summary {
        padding-right: 110px;
      }
      .withcopy.prompt-w {
        margin-top: 10px;
      }
      .withcopy.prompt-w > [data-copy] {
        top: 4px;
        right: 5px;
      }
      details.commit pre {
        margin: 0 12px 12px;
        white-space: pre-wrap;
      }

      /* tabs */
      .tabs {
        position: sticky;
        top: 0;
        z-index: 4;
        background: var(--bg);
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        margin: 18px 0 16px;
        overflow-x: auto;
      }
      .tab {
        padding: 11px 14px 10px;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--ink);
        text-decoration: none;
      }
      .tab.on {
        color: var(--ink);
        border-bottom-color: var(--accent);
      }
      .tn {
        margin-left: 6px;
        font-size: 11.5px;
        background: var(--soft);
        border-radius: 999px;
        padding: 1px 7px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .tn.bad {
        background: color-mix(in srgb, var(--critical) 14%, var(--panel));
        color: var(--critical);
      }

      /* findings */
      .ftool {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .ftool .chips {
        margin: 0;
      }
      .chip .d {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: 1px;
      }
      .chip:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .chip:disabled:hover {
        border-color: var(--line);
      }
      .kbdhint {
        font-size: 12px;
        color: var(--muted);
      }
      kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
        background: var(--panel);
        color: var(--ink);
      }
      .fall {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .flist {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        overflow: hidden;
      }
      .fpath {
        padding: 7px 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--muted);
        background: var(--soft);
        border-top: 1px solid var(--line);
        word-break: break-all;
      }
      .fpath:first-child {
        border-top: 0;
      }
      .f {
        border-top: 1px solid var(--line);
        scroll-margin-top: 64px;
      }
      .fpath + .f {
        border-top: 0;
      }
      .frow {
        all: unset;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: baseline;
        width: 100%;
        padding: 10px 14px;
        cursor: pointer;
      }
      .frow:hover {
        background: var(--soft);
      }
      .frow:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .f.sel > .frow {
        background: var(--sel);
      }
      .f.open {
        background: color-mix(in srgb, var(--ink) 1.5%, var(--panel));
      }
      .ft {
        line-height: 1.45;
      }
      .f.open .ft {
        font-weight: 600;
      }
      .fl {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .sev {
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .sev:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .fbody {
        display: none;
        padding: 0 16px 16px 102px;
      }
      .f.open .fbody {
        display: block;
      }
      .ftags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        margin: 0 0 4px;
      }
      .fbody p {
        margin: 8px 0;
        max-width: 78ch;
      }
      .fmeta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }
      details.prompt {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      details.prompt > summary {
        padding: 8px 110px 8px 10px;
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }
      details.prompt pre {
        margin: 0 10px 10px;
        white-space: pre-wrap;
      }
      .fempty {
        padding: 32px 20px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
      }
      .fempty b {
        display: block;
        color: var(--ok);
        font-size: 16px;
        margin-bottom: 4px;
      }

      /* change */
      .effort {
        display: inline-flex;
        gap: 8px;
        align-items: baseline;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 13px;
      }
      .effort + p {
        margin: 6px 0 0;
      }
      .lead {
        font-size: 15px;
        line-height: 1.65;
      }
      .lead p,
      .prose p {
        max-width: 75ch;
        margin: 0 0 10px;
      }
      ul.hl {
        list-style: none;
        padding: 0;
        margin: 10px 0;
      }
      ul.hl li {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 10px;
        padding: 5px 0;
        align-items: baseline;
      }
      ul.hl .badge {
        justify-self: start;
      }
      details.fold {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        margin: 8px 0;
      }
      details.fold > summary {
        padding: 10px 14px;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      details.fold > summary:before {
        content: "▸";
        color: var(--muted);
        display: inline-block;
        transition: transform 0.15s;
      }
      details.fold[open] > summary:before {
        transform: rotate(90deg);
      }
      .ftitle {
        flex: 1;
        font-weight: 600;
      }
      .foldb {
        padding: 2px 16px 12px 36px;
        border-top: 1px solid var(--line);
      }
      ul.files {
        list-style: none;
        padding: 0;
        margin: 10px 0;
      }
      ul.files li {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        padding: 1px 0;
        word-break: break-all;
        color: var(--muted);
      }

      /* standards */
      .sfilters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .slist {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        overflow: hidden;
      }
      .scat {
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        background: var(--soft);
        border-top: 1px solid var(--line);
      }
      .scat:first-child {
        border-top: 0;
      }
      .srow {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        padding: 9px 12px;
        border-top: 1px solid var(--line);
        color: var(--ink);
      }
      .scat + .srow {
        border-top: 0;

      .srow:hover {
        background: var(--soft);
        text-decoration: none;
      }
      .srow.on {
        background: var(--sel);
      }
      .srow.on .st {
        font-weight: 600;
      }
      .srow .sid {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;

      .srow .sm {

        gap: 10px;

      .sdetail {
        position: sticky;

        border: 1px solid var(--line);

      .sdetail h2 {

        margin: 8px 0 6px;
        line-height: 1.3;

      dl.sm2 {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 6px 12px;
        font-size: 12.5px;
        margin: 12px 0;
      }
      dl.sm2 dt {
        color: var(--muted);
      }
      dl.sm2 dd {
        margin: 0;
        word-break: break-word;
      }

      /* help */
      .help {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 36px;
        align-items: start;
      }
      .toc {
        position: sticky;
        top: 20px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        font-size: 13px;
      }
      .toc a {
        color: var(--muted);
        padding: 5px 10px;
        border-radius: 6px;
      }
      .toc a:hover {
        color: var(--ink);
        text-decoration: none;
      }
      .toc a .tnum {
        display: inline-block;
        width: 22px;
        font-variant-numeric: tabular-nums;
      }
      .toc a.on {
        color: var(--ink);
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--line);
        font-weight: 600;
      }
      .hsec {
        padding: 8px 0 28px;
        border-top: 1px solid var(--line);
        scroll-margin-top: 12px;
      }
      .hsec h2 {
        font-size: 18px;
        margin: 18px 0 10px;
      }
      .hsec h2 .num {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        min-width: 22px;
      }
      .hsec p,
      .hsec li {
        max-width: 75ch;
      }
      .say {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        padding: 8px 8px 8px 14px;
        margin: 12px 0;
      }
      .lbl2 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 2px 0 4px;
      }
      .phrase {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 0;
      }
      .phrase q {
        font-weight: 600;
      }
      dl.kv {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 4px 16px;
        margin: 12px 0;
      }
      dl.kv dt {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        padding-top: 3px;
      }
      dl.kv dd {
        margin: 0;
      }
      dl.kv dd p {
        margin: 0 0 6px;
      }
      dl.kv dd ul {
        margin: 0 0 6px;
        padding-left: 18px;
      }
      ol.cycle {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        list-style: none;
        padding: 0;
        margin: 14px 0;
      }
      ol.cycle li {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      ol.cycle li.arr {
        background: none;
        border: 0;
        padding: 0;
        color: var(--muted);
      }
      table.htable td {
        font-size: 13.5px;
      }
      table.htable td:first-child {
        font-weight: 500;
      }
      .checklist {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px 8px;
        margin: 18px 0 26px;
      }
      .checklist .ch {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .progress {
        height: 6px;
        background: var(--soft);
        border-radius: 4px;
        overflow: hidden;
        margin: 10px 0 6px;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .ck {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 4px 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .ck .ic .ico {
        font-size: 11px;
      }
      .ck .ic {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid var(--muted);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        margin-top: 2px;
      }
      .ck.done .ic {
        background: var(--ok);
        border-color: var(--ok);
        color: var(--panel);
      }
      .ck.done .ckt {
        color: var(--muted);
      }
      .ck .ckt {
        font-weight: 600;
      }
      .ck .cks {
        grid-column: 2;
        display: flex;
        gap: 8px 12px;
        flex-wrap: wrap;
        align-items: center;
        font-size: 12.5px;
      }
      .ck .cks q {
        font-weight: 600;
      }
      .welcome {
        max-width: 720px;
      }

      @media (max-width: 760px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .side {
          display: none;
        }
        .mtop {
          display: flex;
          gap: 10px;
          align-items: center;
          padding: 10px 16px;
          border-bottom: 1px solid var(--line);
          position: sticky;
          top: 0;
          z-index: 6;
          background: var(--bg);
        }
        .mtop .brand {
          font-weight: 700;
          color: var(--ink);
          white-space: nowrap;
        }
        .mtop select {
          flex: 1;
          min-width: 0;
        }
        #app {
          padding: 16px 16px 80px;
        }
        .tabs {
          top: 52px;
        }
        .frow {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 2px 10px;
        }
        .frow .sev {
          grid-column: 1 / -1;
        }
        .fbody {
          padding: 0 14px 14px;
        }
        .kbdhint {
          display: none;
        }
        .split {
          grid-template-columns: minmax(0, 1fr);
        }
        .sdetail {
          position: static;
          max-height: none;
          scroll-margin-top: 64px;
        }
        .help {
          grid-template-columns: minmax(0, 1fr);
          gap: 4px;
        }
        .toc {
          top: 52px;
          z-index: 3;
          flex-direction: row;
          overflow-x: auto;
          background: var(--bg);
          padding: 6px 0;
        }
        .toc a {
          white-space: nowrap;
        }
        .hsec {
          scroll-margin-top: 104px;
        }
        dl.kv,
        dl.sm2 {
          grid-template-columns: minmax(0, 1fr);
        }
        ul.hl li {
          grid-template-columns: minmax(0, 1fr);
          gap: 2px;
        }
        .foldb {
          padding-left: 16px;
        }
        th,
        td {
          padding: 7px 5px;
        }
        .sec {
          padding: 14px;
        }
        .hbar {
          grid-template-columns: minmax(70px, 40%) 1fr 36px;
        }
      }
    </style>
  </head>
  <body>
    <header class="mtop">
      <a class="brand" href="#/">Code review</a>
      <select id="msel" aria-label="Go to"></select>
    </header>
    <div class="shell">
      <aside class="side" id="side"></aside>
      <main id="app"><p class="muted">Loading…</p></main>
    </div>

    <script>
      window.CRR = {
        files: [],
        branches: [],
        standards: [],
        stdlog: [],
        config: null,
        local: null,
        missing: [],
      };
      function CRR_FILE(p) {
        if (CRR.files.indexOf(p) < 0) CRR.files.push(p);
      }
      function CRR_LOAD(kind, obj) {
        if (kind === "branch") CRR.branches.push(obj);
        else if (kind === "standard") CRR.standards.push(obj);
        else if (kind === "stdlog") CRR.stdlog.push(obj);
        else if (kind === "config") CRR.config = obj;
        else if (kind === "local") CRR.local = obj;
      }
    </script>
    <script
      src="data/index.js"
      onerror="CRR.missing.push('data/index.js')"
    ></script>
    <script
      src="data/config.js"
      onerror="CRR.missing.push('data/config.js')"
    ></script>
    <script src=".tmp/local.js" onerror="/* optional, per-worktree */"></script>
    <script>
      (function () {
        "use strict";
        var SEV = ["critical", "major", "minor", "nitpick"];
        var SEV_LABEL = {
          critical: "Critical",
          major: "Major",
          minor: "Minor",
          nitpick: "Nitpick",
        };
        var SEV_COLOR = {
          critical: "var(--critical)",
          major: "var(--major)",
          minor: "var(--minor)",
          nitpick: "var(--nitpick)",
        };
        var PALETTE = [
          "var(--c1)",
          "var(--c2)",
          "var(--c3)",
          "var(--c4)",
          "var(--c5)",
          "var(--c6)",
        ];
        var app = document.getElementById("app"),
          side = document.getElementById("side"),
          msel = document.getElementById("msel");

        // ---------------------------------------------------------------- loading
        function loadAll(done) {
          var list = CRR.files.slice(),
            i = 0;
          (function next() {
            if (i >= list.length) return done();
            var s = document.createElement("script");
            var f = list[i++];
            s.src = "data/" + f;
            s.onload = next;
            s.onerror = function () {
              CRR.missing.push(f);
              next();
            };
            document.body.appendChild(s);
          })();
        }

        // ---------------------------------------------------------------- helpers
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function inl(s) {
          s = esc(s);
          s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
          s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          s = s.replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g, "$1<em>$2</em>");
          s = s.replace(
            /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>',
          );
          s = s.replace(
            /\b(STD-[0-9a-f]{4})\b/g,
            '<a href="#/standards/$1">$1</a>',
          );
          return s;
        }
        function md(text) {
          if (!text) return "";
          var out = [],
            para = [],
            list = null,
            code = null,
            lang = "";
          function fp() {
            if (para.length) {
              out.push("<p>" + para.map(inl).join(" ") + "</p>");
              para = [];
            }
          }
          function fl() {
            if (list) {
              out.push(
                "<" +
                  list.t +
                  ">" +
                  list.items
                    .map(function (x) {
                      return "<li>" + inl(x) + "</li>";
                    })
                    .join("") +
                  "</" +
                  list.t +
                  ">",
              );
              list = null;
            }
          }
          String(text)
            .split("\n")
            .forEach(function (line) {
              var t = line.trim();
              if (t.indexOf("```") === 0) {
                if (code) {
                  out.push(
                    lang === "diff"
                      ? diffHtml(code.join("\n"))
                      : '<pre class="code">' + esc(code.join("\n")) + "</pre>",
                  );
                  code = null;
                } else {
                  fp();
                  fl();
                  code = [];
                  lang = t.slice(3).trim().toLowerCase();
                }
                return;
              }
              if (code) {
                code.push(line);
                return;
              }
              var ul = /^\s*[-*]\s+(.*)/.exec(line),
                ol = /^\s*\d+[.)]\s+(.*)/.exec(line),
                h = /^#{1,4}\s+(.*)/.exec(line);
              if (h) {
                fp();
                fl();
                out.push("<h3>" + inl(h[1]) + "</h3>");
              } else if (ul || ol) {
                fp();
                var tg = ul ? "ul" : "ol";
                if (!list || list.t !== tg) {
                  fl();
                  list = { t: tg, items: [] };
                }
                list.items.push((ul || ol)[1]);
              } else if (!t) {
                fp();
                fl();
              } else {
                fl();
                para.push(t);
              }
            });
          if (code)
            out.push('<pre class="code">' + esc(code.join("\n")) + "</pre>");
          fp();
          fl();
          return out.join("");
        }
        function diffHtml(s) {
          return (
            '<pre class="diff">' +
            String(s)
              .replace(/\n$/, "")
              .split("\n")
              .map(function (l) {
                var c =
                  l.indexOf("@@") === 0
                    ? "h"
                    : l[0] === "+" && l.indexOf("+++") !== 0
                      ? "a"
                      : l[0] === "-" && l.indexOf("---") !== 0
                        ? "d"
                        : "";
                return '<span class="' + c + '">' + (esc(l) || " ") + "</span>";
              })
              .join("") +
            "</pre>"
          );
        }
        function logKey(l) {
          return String(l.seq || l.at || "");
        }
        function fmtDate(s) {
          return s ? String(s).replace("T", " ").slice(0, 16) : "—";
        }
        function day(s) {
          return s ? String(s).slice(0, 10) : "";
        }
        function loc(c) {
          var s = c.file;
          if (c.line_start) {
            s += ":" + c.line_start;
            if (c.line_end && c.line_end !== c.line_start)
              s += "-" + c.line_end;
          }
          return s;
        }
        function sevBadge(s) {
          return (
            '<span class="badge sev-' + s + '">' + SEV_LABEL[s] + "</span>"
          );
        }
        function verdictBadge(v) {
          return v === "ready"
            ? '<span class="badge ok">Ready</span>'
            : v === "blocked"
              ? '<span class="badge bad">Blocked</span>'
              : '<span class="badge muted">—</span>';
        }
        function openC(b) {
          return (b.comments || []).filter(function (c) {
            return c.status === "open";
          });
        }
        function bySev(list) {
          var o = { critical: 0, major: 0, minor: 0, nitpick: 0 };
          list.forEach(function (c) {
            o[c.severity] = (o[c.severity] || 0) + 1;
          });
          return o;
        }
        function stdById(id) {
          for (var i = 0; i < CRR.standards.length; i++)
            if (CRR.standards[i].id === id) return CRR.standards[i];
          return null;

        function hbars(rows, opts) {

            Math.max.apply(

              series.map(function (s) {
                return s.segments.reduce(function (a, x) {
                  return a + x.value;
                }, 0);
              }),
            ) || 1;

            .map(function (s, i) {
              var y = H - pad,
                x = pad + i * bw + 2,

                        w +

            W +
