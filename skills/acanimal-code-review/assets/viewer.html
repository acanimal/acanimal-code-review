        }
        function nonNit(c) {
          return c.severity !== "nitpick";
        }
        function isBlocking(c) {
          return c.severity === "critical" || c.severity === "major";
        }
        function blockersOf(b) {
          var cs = openC(b).filter(isBlocking);
          var checks = (b.checks_latest || []).filter(function (r) {
            return r.status === "fail" && checkName(r.id).blocking;
          });
          return { comments: cs, checks: checks, n: cs.length + checks.length };
        }
        function stateOf(b) {
          return !b.verdict ? "none" : blockersOf(b).n ? "blocked" : "ready";
        }
        function sortedBranches() {
          return CRR.branches.slice().sort(function (a, b) {
            return (
              isCurrent(b) - isCurrent(a) ||
              isLocal(b) - isLocal(a) ||
              String(b.updated_at).localeCompare(String(a.updated_at))
            );
          });
        }
        function findBranch(slug) {
          return CRR.branches.filter(function (x) {
            return x.slug === slug;
          })[0];
        }
        function bHref(b, tab, q) {
          return (
            "#/b/" +
            encodeURIComponent(b.slug) +
            (tab ? "/" + tab : "") +
            (q ? "?" + q : "")
          );
        }
        function lines(c) {
          if (!c.line_start) return "";
          return (
            "L" +
            c.line_start +
            (c.line_end && c.line_end !== c.line_start ? "–" + c.line_end : "")
          );
        }
        function promptOf(c) {
          return (
            c.agent_prompt ||
            "In " + loc(c) + ": " + c.title + ". " + (c.body || "")
          );
        }
        function proposedCount() {
          return CRR.standards.filter(function (s) {
            return s.status === "proposed";
          }).length;
        }
        function plural(n, w) {
          return n + " " + w + (n === 1 ? "" : "s");
        }

        // ---------------------------------------------------------------- navigation
        function renderNav(v, slug) {
          var bs = sortedBranches(),
            prop = proposedCount();
          var h =
            '<a class="brand" href="#/">Code review' +
            (repoName() ? "<span>" + esc(repoName()) + "</span>" : "") +
            '</a><div class="side-h">Project</div><nav>' +
            pl("insights", "#/insights", "Insights", "") +
            pl(
              "standards",
              "#/standards",
              "Standards",
              prop
                ? '<span class="bc warn" title="proposed standards waiting for validation">' +
                    prop +
                    " to validate</span>"
                : "",
            ) +
            pl("help", "#/help", "Help", "") +
            '</nav><div class="side-h">Branches</div><nav>';
          bs.forEach(function (b) {
            var n = openC(b).filter(nonNit).length;
            h +=
              '<a class="bl' +
              (v === "branch" && b.slug === slug ? " on" : "") +
              (isLocal(b) ? "" : " hist") +
              '" href="' +
              bHref(b) +
              '" title="' +
              esc(b.branch + (isLocal(b) ? "" : " (historical)")) +
              '"><i class="dot ' +
              stateOf(b) +
              '"></i><span class="bn">' +
              esc(b.branch) +
              "</span>" +
              (isCurrent(b) ? '<span class="cur">current</span>' : "") +
              (n ? '<span class="bc" title="open findings">' + n + "</span>" : "") +
              "</a>";
          });
          var ghost =
            CRR.local && CRR.local.current_branch && !bs.some(isCurrent);
          if (ghost)
            h +=
              '<div class="bl ghost" title="Not reviewed yet"><i class="dot"></i><span class="bn">' +
              esc(CRR.local.current_branch) +
              '</span><span class="cur">not reviewed</span></div>';
          if (!bs.length && !ghost)
            h += '<p class="side-empty">No reviews yet</p>';
          h += "</nav>";
          side.innerHTML = h;

          var cur = v === "branch" ? "b:" + slug : v;
          msel.innerHTML =
            '<optgroup label="Project">' +
            [
              ["insights", "#/insights", "Insights"],
              ["standards", "#/standards", "Standards"],
              ["help", "#/help", "Help"],
            ]
              .map(function (x) {
                return (
                  '<option value="' +
                  x[1] +
                  '"' +
                  (cur === x[0] ? " selected" : "") +
                  ">" +
                  x[2] +
                  "</option>"
                );
              })
              .join("") +
            '</optgroup><optgroup label="Branches">' +
            bs
              .map(function (b) {
                var s = stateOf(b);
                return (
                  '<option value="' +
                  bHref(b) +
                  '"' +
                  (cur === "b:" + b.slug ? " selected" : "") +
                  ">" +
                  (s === "blocked" ? "✕ " : s === "ready" ? "✓ " : "· ") +
                  esc(b.branch) +
                  (isCurrent(b) ? " (current)" : "") +
                  "</option>"
                );
              })
              .join("") +
            "</optgroup>";

          function pl(k, href, label, extra) {
            return (
              '<a class="pl' +
              (v === k ? " on" : "") +
              '" href="' +
              href +
              '"><span class="bn2">' +
              label +
              "</span>" +
              extra +
              "</a>"
            );
          }
        }

        // ---------------------------------------------------------------- branch
        function viewBranch(slug, tab, q) {
          var b = findBranch(slug);
          if (!b)
            return (
              '<h1>Branch not found</h1><p class="muted">No review data for <code>' +
              esc(slug) +
              '</code>. <a href="' +
              (sortedBranches()[0] ? bHref(sortedBranches()[0]) : "#/") +
              '">Go to the current branch →</a></p>'
            );
          if (UI.slug !== b.slug) {
            UI.slug = b.slug;
            UI.sev = "all";
            UI.nits = false;
            UI.cur = null;
            UI.curOpen = false;
          }
          var open = openC(b),
            act = open.filter(nonNit);
          var closed = (b.comments || []).filter(function (c) {
            return c.status !== "open";
          });
          var issues = (b.checks_latest || []).filter(function (r) {
            return r.status === "fail" || r.status === "warn";
          });
          var focus = qp(q, "id"),
            fc = focus
              ? open.filter(function (c) {
                  return c.id === focus;
                })[0]
              : null;
          if (fc) {
            UI.cur = fc.id;
            UI.curOpen = true;
            UI.sev = "all";
            if (fc.severity === "nitpick") UI.nits = true;
            tab = "findings";
          }
          if (TABS.indexOf(tab) < 0) tab = open.length ? "findings" : "change";
          CUR = { view: "branch", b: b, tab: tab, open: open };
          var cnt = {
            findings: act.length,
            change: null,
            checks: issues.length,
            history: reviewRuns(b).length,
          };
          var bad = {
            findings: act.some(isBlocking),
            checks: issues.some(function (r) {
              return r.status === "fail";
            }),
          };
          var h = branchHeader(b);
          h +=
            '<div class="tabs" role="tablist">' +
            TABS.map(function (t, i) {
              return (
                '<a class="tab' +
                (t === tab ? " on" : "") +
                '" role="tab" aria-selected="' +
                (t === tab) +
                '" href="' +
                bHref(b, t) +
                '" title="Shortcut: ' +
                (i + 1) +
                '">' +
                TAB_LABEL[t] +
                (cnt[t] != null
                  ? '<span class="tn' +
                    (bad[t] ? " bad" : "") +
                    '">' +
                    cnt[t] +
                    "</span>"
                  : "") +
                "</a>"
              );
            }).join("") +
            "</div>";
          h +=
            '<div class="tabbody">' +
            (tab === "findings"
              ? findingsTab(b, open)
              : tab === "change"
                ? changeTab(b)
                : tab === "checks"
                  ? checksTab(b)
                  : historyTab(b, closed)) +
            "</div>";
          return h;
        }

        function branchHeader(b) {
          var h =
            '<header class="bh" id="bh"><div class="bh-top"><h1><code>' +
            esc(b.branch) +
            "</code></h1>" +
            (isCurrent(b) ? '<span class="badge cur-b">current</span>' : "") +
            (isLocal(b) ? "" : '<span class="badge muted">historical</span>') +
            '</div><p class="meta">base <code>' +
            esc(b.base || "—") +
            "</code> · " +
            plural(reviewRuns(b).length, "review") +
            " · last " +
            fmtDate(b.last_review && b.last_review.at) +
            "</p>" +
            verdictStrip(b);
          if (b.commit_message)
            h +=
              '<div class="withcopy"><details class="commit"><summary><span class="lbl3">Commit message</span><span class="cm1 mono">' +
              esc(String(b.commit_message).split("\n")[0]) +
              '</span></summary><pre class="code">' +
              esc(b.commit_message) +
              "</pre></details>" +
              copyBtn(b.commit_message) +
              "</div>";
          if ((b.suggestions || []).length)
            h += alertsHtml(
              b.suggestions.map(function (s) {
                return { cls: "info", html: ico("bulb") + "<span>" + inl(s.text) + "</span>" };
              }),
            );
          return h + "</header>";
        }

        function verdictStrip(b) {
          if (!b.verdict)
            return '<div class="verdict none"><span class="vi"></span><div class="vt">Not reviewed yet</div></div>';
          var k = blockersOf(b);
          if (!k.n)
            return '<div class="verdict ready"><span class="vi">' + ico("check") + '</span><div><div class="vt">Ready to commit</div><div class="vs">No open critical or major findings and no blocking check failing.</div></div></div>';
          return (
            '<div class="verdict blocked"><span class="vi">' +
            ico("x") +
            '</span><div><div class="vt">' +
            plural(k.n, "blocker") +
            ' — not ready to commit</div><div class="bks">' +
            k.comments
              .map(function (c) {
                return (
                  '<a class="bk" href="' +
                  bHref(b, "findings", "id=" + c.id) +
                  '" title="' +
                  esc(c.title) +
                  '"><span class="sev sev-' +
                  c.severity +
                  '"></span>' +
                  esc(c.id) +
                  "</a>"
                );
              })
              .join("") +
            k.checks
              .map(function (r) {
                return (
                  '<a class="bk" href="' +
                  bHref(b, "checks") +
                  '">check: ' +
                  esc(checkName(r.id).name || r.id) +
                  "</a>"
                );
              })
              .join("") +
            "</div></div></div>"
          );
        }

        // ---------------------------------------------------------------- findings
        function visibleFindings(open) {
          return open.filter(function (c) {
            return c.severity === "nitpick"
              ? UI.nits
              : UI.sev === "all" || UI.sev === c.severity;
          });
        }
        function groupByFile(list) {
          list = list.slice().sort(function (x, y) {
            return (
              SEV.indexOf(x.severity) - SEV.indexOf(y.severity) ||
              x.file.localeCompare(y.file) ||
              (x.line_start || 0) - (y.line_start || 0)
            );
          });
          var order = [],
            g = {};
          list.forEach(function (c) {
            if (!g[c.file]) {
              g[c.file] = [];
              order.push(c.file);
            }
            g[c.file].push(c);
          });
          return order.map(function (f) {
            return { file: f, items: g[f] };
          });
        }

        function findingsTab(b, open) {
          if (!open.length)
            return (
              '<div class="fempty"><b>No open findings</b>' +
              (b.verdict
                ? "Everything raised in previous reviews is closed. See History for the details."
                : "This branch has not been reviewed yet.") +
              "</div>"
            );
          var c = bySev(open);
          var h =
            '<div class="ftool"><div class="chips">' +
            chip("all", "All", open.length - c.nitpick) +
            ["critical", "major", "minor"]
              .map(function (s) {
                return chip(s, SEV_LABEL[s], c[s]);
              })
              .join("") +
            (c.nitpick
              ? '<button class="chip' +
                (UI.nits ? " on" : "") +
                '" data-nits><span class="d" style="background:var(--nitpick)"></span>' +
                (UI.nits ? "Hide " : "Show ") +
                plural(c.nitpick, "nitpick") +
                "</button>"
              : "") +
            '</div><span class="kbdhint"><kbd>j</kbd> <kbd>k</kbd> move · <kbd>Enter</kbd> open · <kbd>c</kbd> copy prompt</span></div>';
          return h + '<div id="flist">' + findingsList(open) + "</div>";

          function chip(k, label, n) {
            return (
              '<button class="chip' +
              (UI.sev === k ? " on" : "") +
              '" data-f="' +
              k +
              '"' +
              (n || k === "all" ? "" : " disabled") +
              ">" +
              (k !== "all"
                ? '<span class="d" style="background:' + SEV_COLOR[k] + '"></span>'
                : "") +
              label +
              " · " +
              n +
              "</button>"
            );
          }
        }

        function findingsList(open) {
          var vis = visibleFindings(open);
          if (!vis.length)
            return '<div class="fempty">No findings match this filter.</div>';
          var groups = groupByFile(vis),
            flat = [];
          groups.forEach(function (g) {
            g.items.forEach(function (c) {
              flat.push(c.id);
            });
          });
          if (flat.indexOf(UI.cur) < 0) {
            UI.cur = flat[0];
            UI.curOpen = true;
          }
          var all =
            "Verify each finding against the current code and only fix it if it is still valid.\n\n" +
            vis
              .map(function (c) {
                return (
                  "- [" +
                  c.severity +
                  "] " +
                  (c.agent_prompt || "In " + loc(c) + ": " + c.title)
                );
              })
              .join("\n");
          return (
            '<div class="fall"><span class="small muted">' +
            plural(vis.length, "finding") +
            " in " +
            plural(groups.length, "file") +
            "</span>" +
            copyBtn(all, "Copy AI prompt for these " + vis.length) +
            '</div><div class="flist">' +
            groups
              .map(function (g) {
                return (
                  '<div class="fpath">' +
                  esc(g.file) +
                  "</div>" +
                  g.items
                    .map(function (c) {
                      return findingRow(c);
                    })
                    .join("")
                );
              })
              .join("") +
            "</div>"
          );
        }

        function findingRow(c, closed) {
          PROMPTS[c.id] = promptOf(c);
          var on = !closed && UI.cur === c.id,
            open = on && UI.curOpen;
          var std = c.standard ? stdById(c.standard) : null;
          var h =
            '<div class="f' +
            (closed ? " closed" : "") +
            (on ? " sel" : "") +
            (open ? " open" : "") +
            '" data-id="' +
            esc(c.id) +
            '"><button class="frow" type="button" aria-expanded="' +
            open +
            '"><span class="sev sev-' +
            c.severity +
            '">' +
            SEV_LABEL[c.severity] +
            '</span><span class="ft">' +
            tinl(c.title) +
            '</span><span class="fl mono">' +
            (closed
              ? '<span class="badge ' +
                (c.status === "resolved" ? "ok" : "muted") +
                '">' +
                esc(c.status) +
                "</span>"
              : esc(lines(c))) +
            "</span></button>";
          h +=
            '<div class="fbody"><div class="ftags"><span class="badge">' +
            esc(c.category || "other") +
            "</span>" +
            (c.standard
              ? '<a class="badge" href="#/standards/' +
                c.standard +
                '">' +
                c.standard +
                (std ? " · " + esc(std.title) : "") +
                "</a>"
              : "") +
            '<span class="cid mono">' +
            esc(c.id) +
            '</span><span class="loc mono">' +
            esc(loc(c)) +
            "</span></div>" +
            md(c.body);
          if (c.suggestion)
            h +=
              '<div class="lbl">Suggested change</div>' +
              (/^[+-]/m.test(c.suggestion)
                ? diffHtml(c.suggestion)
                : '<pre class="code">' + esc(c.suggestion) + "</pre>");
          if (!closed)
            h +=
              '<div class="withcopy prompt-w"><details class="prompt"><summary>' +
              ico("bot") +
              'Prompt for AI agents</summary><pre class="code">' +
              esc(PROMPTS[c.id]) +
              "</pre></details>" +
              copyBtn(PROMPTS[c.id], "Copy prompt") +
              "</div>";
          h +=
            '<div class="fmeta">Raised in review #' +
            (c.created_run || "?") +
            (c.closed_run ? " · closed in #" + c.closed_run : "") +
            (c.resolution ? " · " + inl(c.resolution) : "") +
            "</div></div></div>";
          return h;
        }

        function refreshFindings() {
          var tb = document.querySelector(".tabbody");
          if (tb && CUR.view === "branch")
            tb.innerHTML = findingsTab(CUR.b, CUR.open);
        }
        function applySel(scroll) {
          document.querySelectorAll("#flist .f").forEach(function (el) {
            var on = el.dataset.id === UI.cur,
              open = on && UI.curOpen;
            el.classList.toggle("sel", on);
            el.classList.toggle("open", open);
            el.querySelector(".frow").setAttribute("aria-expanded", String(open));
            if (on && scroll) el.scrollIntoView({ block: "nearest" });
          });
        }
        function moveSel(d) {
          var els = Array.prototype.slice.call(
            document.querySelectorAll("#flist .f"),
          );
          if (!els.length) return;
          var i = -1;
          els.forEach(function (el, j) {
            if (el.dataset.id === UI.cur) i = j;
          });
          i = Math.max(0, Math.min(els.length - 1, i < 0 ? 0 : i + d));
          UI.cur = els[i].dataset.id;
          UI.curOpen = true;
          applySel(true);
          els[i].querySelector(".frow").focus({ preventScroll: true });
        }

        // ---------------------------------------------------------------- change / checks / history
        function changeTab(b) {
          var h = "",
            s = b.summary,
            w = b.walkthrough;
          if (b.effort)
            h +=
              '<div class="effort"><span class="muted">Review effort</span><b>' +
              esc(b.effort.score) +
              "/5</b>" +
              (b.effort.minutes
                ? '<span class="muted">~' + esc(b.effort.minutes) + " min</span>"
                : "") +
              "</div>" +
              (b.effort.reason
                ? '<p class="small muted">' + inl(b.effort.reason) + "</p>"
                : "");
          if (s) {
            h +=
              '<h2 class="sub">Summary</h2><div class="lead">' +
              md(s.text || "") +
              "</div>";
            if ((s.highlights || []).length)
              h +=
                '<ul class="hl">' +
                s.highlights
                  .map(function (x) {
                    return (
                      '<li><span class="badge">' +
                      esc(x.type) +
                      "</span><span>" +
                      inl(x.text) +
                      "</span></li>"
                    );
                  })
                  .join("") +
                "</ul>";
          }
          if (w) {
            h +=
              '<h2 class="sub">Walkthrough</h2>' +
              (w.overview ? '<div class="prose">' + md(w.overview) + "</div>" : "");
            (w.changes || []).forEach(function (c, i) {
              var files = c.files || [];
              h +=
                '<details class="fold"><summary><span class="ftitle">' +
                (c.cohort
                  ? tinl(c.cohort)
                  : "<code>" + esc(files[0] || "Change " + (i + 1)) + "</code>") +
                '</span><span class="muted small">' +
                plural(files.length, "file") +
                '</span></summary><div class="foldb"><ul class="files">' +
                files
                  .map(function (f) {
                    return "<li>" + esc(f) + "</li>";
                  })
                  .join("") +
                "</ul>" +
                md(c.summary) +
                "</div></details>";
            });
          }
          if (b.diagram)
            h +=
              '<h2 class="sub">Diagram</h2><details class="fold diag" open><summary><span class="ftitle">Sequence diagram</span></summary><div class="foldb scroll"><pre class="mermaid">' +
              esc(b.diagram) +
              "</pre></div></details>";
          return h || '<p class="empty">No summary for this branch yet.</p>';
        }

        function checksTab(b) {
          var rows = b.checks_latest || [];
          if (!rows.length)
            return '<p class="empty">No checks recorded for this branch.</p>';
          var ic = {
            pass: '<span class="ckic ok">' + ico("check") + "</span>",
            warn: '<span class="ckic warn">' + ico("alert") + "</span>",
            fail: '<span class="ckic bad">' + ico("x") + "</span>",
            "n/a": '<span class="ckic muted">' + ico("dash") + "</span>",
          };
          var order = { fail: 0, warn: 1, pass: 2, "n/a": 3 };
          rows = rows.slice().sort(function (x, y) {
            return order[x.status] - order[y.status];
          });
          var li = function (r) {
            var c = checkName(r.id);
            return (
              "<li>" +
              ic[r.status] +
              " " +
              esc(c.name || r.id) +
              (c.blocking ? ' <span class="badge">blocking</span>' : "") +
              (r.note && r.status !== "pass" && r.status !== "n/a"
                ? '<div class="muted">' + inl(r.note) + "</div>"
                : "") +
              "</li>"
            );
          };
          var issues = rows.filter(function (r) {
            return r.status === "fail" || r.status === "warn";
          });
          var rest = rows.filter(function (r) {
            return r.status === "pass" || r.status === "n/a";
          });
          var np = rest.filter(function (r) {
            return r.status === "pass";
          }).length;
          return (
            '<h2 class="sub">Needs attention</h2><div class="sec" style="margin:0"><ul class="clean">' +
            (issues.length
              ? issues.map(li).join("")
              : '<li class="ok">' + ico("check") + " No check failing or warning</li>") +
            '</ul></div><h2 class="sub">Everything else</h2><details class="fold"><summary><span class="ftitle">' +
            np +
            " passed · " +
            (rest.length - np) +
            ' not applicable</span></summary><div class="foldb"><ul class="clean small">' +
            rest.map(li).join("") +
            '</ul></div></details><p class="small muted">Checks run on every review. Blocking checks make the branch “Blocked” when they fail; change them with <code>CRR config --check ID --blocking true|false</code>.</p>'
          );
        }

        function historyTab(b, closed) {
          var h =
            '<h2 class="sub">Review runs</h2><div class="tl">' +
            (b.runs || [])
              .slice()
              .reverse()
              .map(function (r) {
                var c = r.counts || {};
                return (
                  '<div class="ev ' +
                  (r.verdict || "") +
                  '"><b>#' +
                  r.n +
                  "</b> · " +
                  fmtDate(r.at) +
                  ' · <span class="badge">' +
                  esc(r.kind) +
                  "</span> " +
                  verdictBadge(r.verdict) +
                  '<div class="small muted">+' +
                  (c["new"] || 0) +
                  " new · " +
                  (c.resolved || 0) +
                  " resolved · " +
                  (c.dismissed || 0) +
                  " dismissed · " +
                  (c.excepted || 0) +
                  " excepted · " +
                  (c.reopened || 0) +
                  " reopened" +
                  (r.files_reviewed != null
                    ? " · " + r.files_reviewed + " file(s)"
                    : "") +
                  (r.head
                    ? ' · <span class="mono">' +
                      esc(String(r.head).slice(0, 8)) +
                      "</span>"
                    : "") +
                  (r.agent ? " · " + esc(r.agent) : "") +
                  "</div>" +
                  (r.note ? '<div class="small">' + inl(r.note) + "</div>" : "") +
                  "</div>"
                );
              })
              .join("") +
            "</div>";
          h +=
            '<h2 class="sub">Closed findings · ' +
            closed.length +
            "</h2>" +
            (closed.length
              ? '<div class="flist" id="hlist">' +
                groupByFile(closed)
                  .map(function (g) {
                    return (
                      '<div class="fpath">' +
                      esc(g.file) +
                      "</div>" +
                      g.items
                        .map(function (c) {
                          return findingRow(c, true);
                        })
                        .join("")
                    );
                  })
                  .join("") +
                "</div>"
              : '<p class="empty">No closed findings yet.</p>');
          return h;
        }

        // ---------------------------------------------------------------- standards
        function stdMatches(s) {
          return (
            (UI.stdF === "all" || s.status === UI.stdF) &&
            (!UI.stdCat || s.category === UI.stdCat) &&
            (!UI.stdQ ||
              (s.id + " " + s.title + " " + s.description)
                .toLowerCase()
                .indexOf(UI.stdQ) >= 0)
          );
        }
        function violations(id) {
          var n = 0;
          CRR.branches.forEach(function (b) {
            (b.comments || []).forEach(function (c) {
              if (c.standard === id) n++;
            });
          });
          return n;
        }
        function lvlCls(l) {
          return (
            {
              required: "sev-major",
              recommended: "sev-minor",
              preference: "sev-nitpick",
            }[l] || ""
          );
        }

        function viewStandards(focus, f) {
          if (f) UI.stdF = f;
          var fs = focus ? stdById(focus) : null;
          if (fs) {
            UI.stdSel = fs.id;
            if (!stdMatches(fs)) {
              UI.stdF = "all";
              UI.stdCat = "";
              UI.stdQ = "";
            }
          }
          var st = CRR.standards;
          var count = function (k) {
            return st.filter(function (s) {
              return s.status === k;
            }).length;
          };
          var cats = Array.from(
            new Set(
              st.map(function (s) {
                return s.category;
              }),
            ),
          ).sort();
          var h =
            '<h1>Standards</h1><p class="meta">The rules every review enforces. <b>Proposed</b> standards are not enforced until you validate them — say “show pending standards” to your agent.</p>';
          if (!st.length)
            return (
              h +
              '<div class="fempty">No standards yet. Say “analyze the project standards” to your agent. <a href="#/help/standards">How it works →</a></div>'
            );
          h +=
            '<div class="ftool"><div class="chips">' +
            ["active", "proposed", "deprecated", "rejected", "all"]
              .map(function (k) {
                return (
                  '<button class="chip' +
                  (UI.stdF === k ? " on" : "") +
                  '" data-sf="' +
                  k +
                  '">' +
                  k[0].toUpperCase() +
                  k.slice(1) +
                  (k !== "all" ? " · " + count(k) : "") +
                  "</button>"
                );
              })
              .join("") +
            '</div><div class="sfilters"><select id="scat"><option value="">All categories</option>' +
            cats
              .map(function (c) {
                return (
                  "<option" +
                  (UI.stdCat === c ? " selected" : "") +
                  ">" +
                  esc(c) +
                  "</option>"
                );
              })
              .join("") +
            '</select><input class="search" id="sq" placeholder="Search…" value="' +
            esc(UI.stdQ) +
            '"></div></div>';
          var log = CRR.stdlog
            .slice()
            .sort(function (a, b) {
              return logKey(b).localeCompare(logKey(a));
            })
            .slice(0, 30);
          h +=
            '<div class="split"><div><div id="slist">' +
            stdList() +
            '</div><details class="fold"><summary><span class="ftitle">Recent changes</span><span class="muted small">' +
            log.length +
            '</span></summary><div class="foldb"><ul class="clean small">' +
            log
              .map(function (l) {
                return (
                  "<li>" +
                  fmtDate(l.at) +
                  ' · <a href="#/standards/' +
                  l.standard +
                  '">' +
                  l.standard +
                  "</a> · <b>" +
                  esc(l.action) +
                  "</b>" +
                  (l.reason ? " — " + inl(l.reason) : "") +
                  "</li>"
                );
              })
              .join("") +
            '</ul></div></details></div><div class="sdetail" id="sdetail">' +
            stdDetail() +
            "</div></div>";
          return h;
        }

        function stdList() {
          var list = CRR.standards.filter(stdMatches).sort(function (a, b) {
            return (
              a.category.localeCompare(b.category) ||
              a.title.localeCompare(b.title)
            );
          });
          if (!list.length)
            return '<div class="slist"><p class="empty" style="padding:12px">No standards match.</p></div>';
          if (
            !list.some(function (s) {
              return s.id === UI.stdSel;
            })
          )
            UI.stdSel = list[0].id;
          var cur = null,
            h = '<div class="slist">';
          list.forEach(function (s) {
            if (s.category !== cur) {
              cur = s.category;
              h += '<div class="scat">' + esc(cur) + "</div>";
            }
            var v = violations(s.id);
            h +=
              '<a class="srow' +
              (s.id === UI.stdSel ? " on" : "") +
              '" href="#/standards/' +
              s.id +
              '"><span class="sid">' +
              s.id +
              '</span><span class="st">' +
              tinl(s.title) +
              '</span><span class="sm"><span class="' +
              lvlCls(s.level) +
              '">' +
              esc(s.level) +
              "</span>" +
              (s.status !== "active" ? "<span>" + esc(s.status) + "</span>" : "") +
              (s.divergence ? '<span class="bad">divergent</span>' : "") +
              (v ? "<span>" + plural(v, "finding") + "</span>" : "") +
              "</span></a>";
          });
          return h + "</div>";
        }

        function stdDetail() {
          var s = UI.stdSel ? stdById(UI.stdSel) : null;
          if (!s || !stdMatches(s))
            return '<p class="empty">Select a standard.</p>';
          var h =
            '<div class="ftags"><span class="mono muted">' +
            s.id +
            '</span><span class="badge ' +
            lvlCls(s.level) +
            '">' +
            esc(s.level) +
            '</span><span class="badge">' +
            esc(s.status) +
            '</span><span class="badge">' +
            esc(s.category) +
            '</span><span class="badge muted">' +
            esc(s.origin) +
            "</span>" +
            (s.divergence ? '<span class="badge bad">divergent</span>' : "") +
            "</div><h2>" +
            inl(s.title) +
            "</h2>" +
            md(s.description);
          if (s.status === "proposed")
            h += say([
              "activate " + s.id,
              "reject " + s.id + " because …",
            ]);
          if (s.divergence) h += '<div class="alert">' + inl(s.divergence.note) + "</div>";
          var meta = [];
          if (s.source && s.source.file)
            meta.push([
              "Source",
              "<code>" +
                esc(s.source.file) +
                "</code>" +
                (s.source.detail ? " — " + inl(s.source.detail) : ""),
            ]);
          if (s.scope && (s.scope.paths || []).length)
            meta.push([
              "Scope",
              s.scope.paths
                .map(function (p) {
                  return "<code>" + esc(p) + "</code>";
                })
                .join(" "),
            ]);
          if (s.prevalence) meta.push(["Prevalence", inl(s.prevalence)]);
          if (s.replaced_by)
            meta.push([
              "Replaced by",
              '<a href="#/standards/' +
                esc(s.replaced_by) +
                '">' +
                esc(s.replaced_by) +
                "</a>",
            ]);
          if (s.migration)
            meta.push([
              "Migration",
              "<b>" +
                esc(s.migration.remaining) +
                "</b> usage(s) of the old pattern left (" +
                day(s.migration.measured_at) +
                ")",
            ]);
          meta.push(["Cited by", plural(violations(s.id), "finding")]);
          h +=
            '<dl class="sm2">' +
            meta
              .map(function (m) {
                return "<dt>" + m[0] + "</dt><dd>" + m[1] + "</dd>";
              })
              .join("") +
            "</dl>";
          if ((s.examples || []).length)
            h +=
              '<div class="lbl">Examples</div><ul class="clean small">' +
              s.examples
                .map(function (e) {
                  return (
                    "<li><code>" +
                    esc(e.file || e) +
                    "</code>" +
                    (e.note ? " — " + inl(e.note) : "") +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>";
          if ((s.exceptions || []).length)
            h +=
              '<div class="lbl">Exceptions</div><ul class="clean small">' +
              s.exceptions
                .map(function (e) {
                  var x = excState(e) === "expired";
                  return (
                    "<li><code>" +
                    esc(e.path) +
                    "</code> — " +
                    inl(e.reason) +
                    (e.expires
                      ? ' <span class="badge ' +
                        (x ? "bad" : "") +
                        '">' +
                        (x ? "expired " : "until ") +
                        esc(e.expires) +
                        "</span>"
                      : "") +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>";
          var log = CRR.stdlog
            .filter(function (l) {
              return l.standard === s.id;
            })
            .sort(function (a, b) {
              return logKey(b).localeCompare(logKey(a));
            });
          if (log.length)
            h +=
              '<div class="lbl">History</div><ul class="clean small">' +
              log
                .map(function (l) {
                  return (
                    "<li>" +
                    fmtDate(l.at) +
                    " · <b>" +
                    esc(l.action) +
                    "</b>" +
                    (l.reason ? " — " + inl(l.reason) : "") +
                    (l.branch
                      ? ' <span class="muted">(' +
                        esc(l.branch) +
                        (l.run ? " #" + l.run : "") +
                        ")</span>"
                      : "") +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>";
          return h;
        }

        function refreshStd() {
          var l = document.getElementById("slist"),
            d = document.getElementById("sdetail");
          if (l) l.innerHTML = stdList();
          if (d) d.innerHTML = stdDetail();
          document.querySelectorAll(".chip[data-sf]").forEach(function (c) {
            c.classList.toggle("on", c.dataset.sf === UI.stdF);
          });
        }

        // ---------------------------------------------------------------- insights extras
        function branchTable() {
          var bs = sortedBranches();
          if (!bs.length) return '<p class="empty">No reviews yet.</p>';
          return (
            '<div class="scroll"><table><thead><tr><th>Branch</th><th>Verdict</th><th>Open</th><th>Reviews</th><th>Last review</th></tr></thead><tbody>' +
            bs
              .map(function (b) {
                var o = bySev(openC(b));
                return (
                  '<tr class="click' +
                  (isCurrent(b) ? " current" : "") +
                  '" data-href="' +

                  esc(b.branch) +
                  "</code>" +
                  (isLocal(b) ? "" : ' <span class="muted small">historical</span>') +

                    .join(" ") || '<span class="muted">0</span>') +

        // ---------------------------------------------------------------- help

            '<div class="say"><div class="lbl2">Say to your agent</div>' +

              .map(function (p) {

                  '<div class="phrase"><q>' +

        function kv(rows) {

            "</dl>"

        function tbl(head, rows) {
          return (
            '<div class="scroll"><table class="htable"><thead><tr>' +
            head
              .map(function (x) {
                return "<th>" + x + "</th>";
              })
              .join("") +
            "</tr></thead><tbody>" +
            rows
              .map(function (r) {
                return (
                  "<tr>" +
                  r
                    .map(function (c) {
                      return "<td>" + inl(c) + "</td>";

                    .join("") +
                  "</tr>"

              })
              .join("") +
            "</tbody></table></div>"
          );
        }

        function checklistHtml() {
          var prop = proposedCount(),
            cur = CRR.branches.filter(isCurrent)[0],
            items = [];
          items.push({
            done: !!CRR.config,
            t: "Initialize code review in this repo",
            say: "initialize code review",
            sec: "setup",
          });
          items.push({
            done: CRR.standards.length > 0,
            t: "Analyze the project standards",
            say: "analyze the project standards",
            sec: "standards",
          });
          items.push({
            done: CRR.standards.length > 0 && !prop,
            t: prop
              ? "Validate " + plural(prop, "proposed standard")
              : "Validate the proposed standards",
            say: "show pending standards",
            sec: "standards",
            link: prop ? ["#/standards?f=proposed", "See them"] : null,
          });
          items.push({
            done: CRR.branches.length > 0,
            t: "Run your first review",
            say: "review my changes",
            sec: "review",
          });
          if (CRR.local && CRR.local.current_branch)
            items.push({
              done: !!cur,
              t:
                "Review the current branch <code>" +
                esc(CRR.local.current_branch) +
                "</code>",
              say: "review my changes",
              sec: "review",
            });
          if (cur)
            items.push({
              done: stateOf(cur) === "ready",
              t: "Get the current branch ready to commit",
              say: "fix the blockers",
              sec: "act",
              link: [bHref(cur), "Open branch"],
            });
          var n = items.filter(function (x) {
            return x.done;
          }).length;
          if (n === items.length)
            return (
              '<div class="checklist alldone"><span class="ic">' +
              ico("check") +
              "</span><span><b>You're all set.</b> Code review is initialized, standards are validated and the current branch is ready to commit.</span></div>"
            );
          return (
            '<div class="checklist"><div class="ch"><h2 style="margin:0">Getting started</h2><span class="small muted">' +
            n +
            " of " +
            items.length +
            ' done</span></div><div class="progress"><i style="width:' +
            Math.round((100 * n) / items.length) +
            '%"></i></div>' +
            items
              .map(function (x) {
                return (
                  '<div class="ck' +
                  (x.done ? " done" : "") +
                  '"><span class="ic">' +
                  (x.done ? ico("check") : "") +

                  "</span>" +
                  (x.done

                      copyBtn(x.say, "Copy") +

                        : "") +
                      '<a href="#/help/' +
                      x.sec +
                      '">How →</a></div>') +
                  "</div>"
                );
              })
              .join("") +
            "</div>"
          );
        }

                    "Allow it only somewhere",
                    "“ACR-xxxxxx is fine in src/legacy/”",
                    "Adds an exception to the standard for that path (reason required, optional expiry date). Only for findings linked to a standard.",
                  ],
                  [
                    "Clean up in bulk",
                    "“dismiss all nitpicks”",
                    "It lists what will change, then applies it.",
                  ],
                  [
                    "Hand it to another agent",
                    "“Copy AI prompt” button",
                    "Each finding has a self-contained prompt. The Findings tab can also copy one prompt for all visible findings.",
                  ],
                ],
              ) +
              say(["fix the blockers", "explain ACR-xxxxxx"])
            );
          },
          maintain: function () {
            return (
              tbl(
                ["When…", "Say", "What happens"],
                [
                  [
                    "You have a rule that is not recorded",
                    "“in this project we do Y”",
                    "The agent proposes a new standard (title, level, scope). It is saved only after you agree.",
                  ],
                  [
                    "A finding is wrong because the rule changed",
                    "“ACR-xxxxxx is wrong, we use Y”",
                    "It proposes updating the standard.",
                  ],
                  [
                    "A pattern is being replaced",
                    "“deprecate STD-xxxx in favour of STD-yyyy”",
                    "Old code is tolerated, new code must use the replacement. Remaining usages are measured on each re-analysis.",
                  ],
                  [
                    "The code has moved on",
                    "“re-analyze the standards in src/lib”",
                    "Re-runs the analysis (whole repo or one folder), updates migrations and flags standards that no longer match the code.",
                  ],
                  [
                    "An exception has expired",
                    "“renew the exception for STD-xxxx until 2027-03-01” · “remove it”",
                    "Expired exceptions are reported until renewed or removed.",
                  ],
                ],
              ) +
              md(
                "**Divergent standards.** If you change a standard that came from a file (say AGENTS.md), it no longer matches its source. The agent proposes the matching edit to that file; until it is applied, the panel and every review remind you. Alerts like this appear in the banner at the top of the panel and at the end of each review.",
              )
            );
          },
          team: function () {
            return md(
              [
                "- **Commit `.code-review/` with your code.** Each branch has its own data file, so the history survives merges and is visible to the whole team.",
                "- The panel shows every branch visible in your checkout (main, merged branches and the current one). Branches that no longer exist locally are shown as *historical*.",
                "- On merge, `data/index.js` merges automatically. If another `.code-review/data/*.js` file has conflict markers, the script stops and names it: resolve it like any conflict, then say “rebuild the review index” (`CRR index`).",
                "- Never edit files under `.code-review/` by hand — always go through the agent.",
              ].join("\n"),
            );
          },
          trouble: function () {
            return tbl(
              ["Symptom", "What to do"],
              [
                [
                  "“Nothing to review”",
                  "No changes since the last review. Say “review the whole branch” or “full re-review” if you want one anyway.",
                ],
                [
                  "The panel shows old data",
                  "Reload the page. If a branch is still missing, say “rebuild the review index”.",
                ],
                [
                  "“Some data files could not be loaded”",
                  "The index points to missing files (usually after a merge or a manual delete). Say “rebuild the review index”.",
                ],
                [
                  "The current branch is not highlighted",
                  "`.code-review/.tmp/local.js` is generated on each agent run in this worktree. Run any review command.",
                ],
                [
                  "The diagram shows plain text",
                  "Diagrams load Mermaid from a CDN; offline, the source text is shown instead.",
                ],
              ],
            );
          },
          ref: function () {
            return (
              tbl(
                ["You say", "The agent does"],
                [
                  ["“initialize code review”", "`CRR init`"],
                  ["“analyze the project standards”", "`CRR repo-stats`, then records standards with `CRR std`"],
                  ["“review my changes” / “full re-review” / “review the whole branch”", "`CRR context --mode auto|full|branch`, reviews, then `CRR apply`"],
                  ["“explain / fix / dismiss ACR-xxxxxx”", "`CRR show`, then a status update with `CRR apply`"],
                  ["“show pending standards”", "`CRR standards --status proposed`"],
                  ["“open the review panel”", "Gives you the path to `.code-review/index.html`"],
                ],
              ) +
              md(
                [
                  "```",
                  "CRR init                         create/upgrade .code-review/",
                  "CRR context [--mode auto|pending|full|branch]   resolve the diff to review",
                  "CRR apply <run.json>             record a review or a status change",
                  "CRR std <ops.json>               manage standards / exceptions",
                  "CRR list | CRR show <ID> | CRR standards   read data",
                  "CRR config [--language xx] [--base REF] [--check ID --enabled|--blocking true|false]",
                  "CRR repo-stats                   repo size / standards analysis",
                  "CRR index                        rebuild the panel index",
                  "```",
                ].join("\n"),
              ) +
              '<p class="small muted"><code>CRR</code> = <code>python3 &lt;skill dir&gt;/scripts/crr.py</code>. You rarely need these: the agent runs them for you.</p>'
            );
          },
        };

        function viewHelp() {
          var h =
            '<div class="help"><nav class="toc" id="toc">' +
            HELP.map(function (x, i) {
              return (
                '<a href="#/help/' +
                x[0] +
                '" data-sec="' +
                x[0] +
                '"><span class="tnum">' +
                (i + 1) +
                "</span>" +
                x[1] +
                "</a>"
              );
            }).join("") +
            '</nav><div class="hbody"><h1>Guide</h1><p class="meta">How to set up, run and act on local code reviews with your coding agent.</p>' +
            checklistHtml();
          HELP.forEach(function (x, i) {
            h +=
              '<section class="hsec" id="h-' +
              x[0] +
              '"><h2><span class="num">' +
              (i + 1) +
              "</span>" +
              x[1] +
              "</h2>" +
              HELP_BODY[x[0]]() +
              "</section>";
          });
          return h + "</div></div>";
        }
        function initSpy() {
          if (spy) spy.disconnect();
          if (!window.IntersectionObserver) return;
          spy = new IntersectionObserver(
            function (es) {
              es.forEach(function (e) {
                if (!e.isIntersecting) return;
                var id = e.target.id.slice(2);
                document.querySelectorAll("#toc a").forEach(function (a) {
                  a.classList.toggle("on", a.dataset.sec === id);
                });
              });
            },
            { rootMargin: "0px 0px -75% 0px" },
          );
          document.querySelectorAll(".hsec").forEach(function (s) {
            spy.observe(s);
          });
        }

        function viewWelcome() {
          return (
            '<div class="welcome"><h1>Welcome to your code review panel</h1><p class="meta">Nothing has been reviewed yet. Follow these steps with your coding agent — each one tells you what to say.</p>' +
            checklistHtml() +
            '<p><a href="#/help">Read the full guide →</a></p></div>'
          );
        }

        // ---------------------------------------------------------------- router
        var lastKey = null;
        function route() {
          var hash = location.hash.replace(/^#\/?/, ""),
            q = "";
          if (hash.indexOf("?") >= 0) {
            q = hash.slice(hash.indexOf("?") + 1);
            hash = hash.slice(0, hash.indexOf("?"));
          }
          var parts = hash.split("/").map(decodeURIComponent),
            v = parts[0] || "home",
            html;
          COPY = {};
          PROMPTS = {};
          CUR = { view: v };
          if (v === "branch") {
            location.replace(
              parts[1] ? "#/b/" + encodeURIComponent(parts[1]) : "#/",
            );
            return;
          }
          if (v === "home") {
            if (sortedBranches().length) {
              location.replace("#/insights");
              return;
            }
            v = "welcome";
            html = viewWelcome();
          } else if (v === "b") {
            v = "branch";
            html = viewBranch(parts[1], parts[2], q);
          } else if (v === "standards")
            html = viewStandards(parts[1], qp(q, "f"));
          else if (v === "insights") html = viewInsights();
          else if (v === "help") html = viewHelp();
          else {
            location.replace("#/");
            return;
          }
          var al = v === "help" || v === "welcome" ? [] : globalAlerts();
          app.innerHTML =
            (al.length ? '<div class="galerts">' + alertsHtml(al) + "</div>" : "") +
            html;
          renderNav(v, parts[1]);
          if (document.querySelector("details.diag[open]")) renderMermaid();

          var key = v + "/" + (v === "branch" ? parts[1] : "");
          if (v === "help") {
            var sec = parts[1] && document.getElementById("h-" + parts[1]);
            if (sec) sec.scrollIntoView();
            else window.scrollTo(0, 0);
            initSpy();
          } else if (key !== lastKey) window.scrollTo(0, 0);
          else if (v === "branch") {
            var bh = document.getElementById("bh"),
              mt = document.querySelector(".mtop"),
              y = bh.offsetTop + bh.offsetHeight - (mt.offsetHeight || 0);
            if (window.scrollY > y) window.scrollTo(0, y);
          } else if (
            v === "standards" &&
            parts[1] &&
            window.matchMedia("(max-width: 760px)").matches
          ) {
            var sd = document.getElementById("sdetail");
            if (sd) sd.scrollIntoView();
          }
          lastKey = key;
        }

        // ---------------------------------------------------------------- events
        document.addEventListener("click", function (e) {
          var t = e.target.closest("[data-copy]");
          if (t) {
            e.preventDefault();
            copyText(COPY[t.dataset.copy] || "", t);
            return;
          }
          var tr = e.target.closest("tr[data-href]");
          if (tr && !e.target.closest("a")) {
            location.hash = tr.dataset.href;
            return;
          }
          var row = e.target.closest(".frow");
          if (row) {
            var f = row.parentNode;
            if (f.classList.contains("closed")) {
              f.classList.toggle("open");
              return;
            }
            if (UI.cur === f.dataset.id) UI.curOpen = !UI.curOpen;
            else {
              UI.cur = f.dataset.id;
              UI.curOpen = true;
            }
            applySel(false);
            return;
          }
          var fc = e.target.closest(".chip[data-f]");
          if (fc) {
            if (!fc.disabled) {
              UI.sev = fc.dataset.f;
              refreshFindings();
            }
            return;
          }
          if (e.target.closest(".chip[data-nits]")) {
            UI.nits = !UI.nits;
            refreshFindings();
            return;
          }
          var sf = e.target.closest(".chip[data-sf]");
          if (sf) {
            UI.stdF = sf.dataset.sf;
            refreshStd();
            return;
          }
          var hs = e.target.closest(".chip[data-hs]");
          if (hs) {
            document.querySelectorAll(".chip[data-hs]").forEach(function (c) {
              c.classList.toggle("on", c === hs);
            });
            document
              .getElementById("hs-dirs")
              .classList.toggle("hidden", hs.dataset.hs !== "dirs");
            document
              .getElementById("hs-files")
              .classList.toggle("hidden", hs.dataset.hs !== "files");
          }
        });
        document.addEventListener("input", function (e) {
          if (e.target.id === "sq") {
            UI.stdQ = e.target.value.toLowerCase();
            refreshStd();
          } else if (e.target.id === "scat") {
            UI.stdCat = e.target.value;
            refreshStd();
          }
        });
        msel.addEventListener("change", function () {
          location.hash = msel.value;
        });
        document.addEventListener(
          "toggle",
          function (e) {
            if (e.target.classList && e.target.classList.contains("diag") && e.target.open)
              renderMermaid();
          },
          true,
        );
        document.addEventListener("keydown", function (e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
          if (CUR.view !== "branch") return;
          if (/^[1-4]$/.test(e.key)) {
            location.hash = bHref(CUR.b, TABS[+e.key - 1]);
            return;
          }
          if (CUR.tab !== "findings") return;
          if (e.key === "j") {
            e.preventDefault();
            moveSel(1);
          } else if (e.key === "k") {
            e.preventDefault();
            moveSel(-1);
          } else if (e.key === "Enter" && !e.target.closest(".frow")) {
            if (!UI.cur) return;
            UI.curOpen = !UI.curOpen;
            applySel(true);
          } else if (e.key === "Escape") {
            UI.curOpen = false;
            applySel(false);
          } else if (e.key === "c" && UI.cur) {
            var btn = document.querySelector(
              '#flist .f[data-id="' + UI.cur + '"] .prompt-w > [data-copy]',
            );
            if (btn) copyText(PROMPTS[UI.cur] || "", btn);
          }
        });
        window.addEventListener("hashchange", route);

        loadAll(function () {
          if (repoName()) document.title = "Code Review · " + repoName();
          route();
        });
      })();
    </script>
  </body>
</html>
