<!doctype html>
<!-- acanimal-code-review viewer v1. Static file: never edited per review. Data comes from ./data/*.js -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Review Panel</title>
    <style>
      :root {
        --bg: #f6f6f3;
        --panel: #fff;
        --ink: #1b1c1e;
        --muted: #6a6e75;
        --line: #e3e3de;
        --soft: #f0f0ec;
        --accent: #d9480f;
        --add: #e7f6eb;
        --add-ink: #17733a;
        --del: #fdeceb;
        --del-ink: #b42318;
        --hunk: #eef1fb;
        --critical: #d92d20;
        --major: #e8590c;
        --minor: #b7860b;
        --nitpick: #64748b;
        --ok: #15803d;
        --info: #2563eb;
        --c1: #2563eb;
        --c2: #d9480f;
        --c3: #0f9d76;
        --c4: #9333ea;
        --c5: #b7860b;
        --c6: #64748b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121315;
          --panel: #1a1b1e;
          --ink: #e7e7e4;
          --muted: #9b9fa6;
          --line: #2b2d31;
          --soft: #222429;
          --accent: #ff8a3d;
          --add: #11301c;
          --add-ink: #62d483;
          --del: #3a1513;
          --del-ink: #ff8c82;
          --hunk: #1d2240;
          --critical: #ff6b5e;
          --major: #ff8a3d;
          --minor: #f2c94c;
          --nitpick: #9aa5b5;
          --ok: #4ade80;
          --info: #7aa2ff;
          --c1: #7aa2ff;
          --c2: #ff8a3d;
          --c3: #3ddbb0;
          --c4: #c084fc;
          --c5: #f2c94c;
          --c6: #9aa5b5;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121315;
        --panel: #1a1b1e;
        --ink: #e7e7e4;
        --muted: #9b9fa6;
        --line: #2b2d31;
        --soft: #222429;
        --accent: #ff8a3d;
        --add: #11301c;
        --add-ink: #62d483;
        --del: #3a1513;
        --del-ink: #ff8c82;
        --hunk: #1d2240;
        --critical: #ff6b5e;
        --major: #ff8a3d;
        --minor: #f2c94c;
        --nitpick: #9aa5b5;
        --ok: #4ade80;
        --info: #7aa2ff;
        --c1: #7aa2ff;
        --c2: #ff8a3d;
        --c3: #3ddbb0;
        --c4: #c084fc;
        --c5: #f2c94c;
        --c6: #9aa5b5;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14.5px/1.55 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code,
      pre,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      :not(pre) > code {
        background: var(--soft);
        padding: 1px 5px;
        border-radius: 4px;
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1120px;
        margin: 0 auto;
        padding: 10px 16px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand span {
        color: var(--muted);
        font-weight: 500;
      }
      nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      nav a {
        padding: 6px 11px;
        border-radius: 7px;
        color: var(--ink);
        font-weight: 500;
      }
      nav a.on {
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 18px 16px 80px;
      }
      h1 {
        font-size: 22px;
        margin: 4px 0 6px;
        line-height: 1.25;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      h3 {
        font-size: 14px;
        margin: 14px 0 8px;
      }
      .sec {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        margin: 14px 0;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12.5px;
      }
      .n {
        background: var(--soft);
        color: var(--muted);
        border-radius: 999px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        border-radius: 5px;
        padding: 2px 7px;
        background: var(--soft);
        white-space: nowrap;
      }
      .sev-critical {
        color: var(--critical);
      }
      .sev-major {
        color: var(--major);
      }
      .sev-minor {
        color: var(--minor);
      }
      .sev-nitpick {
        color: var(--nitpick);
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--critical);
      }
      .warn {
        color: var(--major);
      }
      .verdict {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        font-weight: 600;
        border: 1px solid var(--line);
      }
      .verdict.ready {
        background: color-mix(in srgb, var(--ok) 12%, var(--panel));
      }
      .verdict.blocked {
        background: color-mix(in srgb, var(--critical) 11%, var(--panel));
      }
      .verdict .big {
        font-size: 18px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        vertical-align: top;
        padding: 9px 8px;
        border-top: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 600;
        border-top: 0;
      }
      tr.click {
        cursor: pointer;
      }
      tr.click:hover td {
        background: var(--soft);
      }
      tr.current td {
        background: color-mix(in srgb, var(--accent) 8%, var(--panel));
      }
      .scroll {
        overflow-x: auto;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0 10px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .chip.on {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 7px;
        padding: 5px 10px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .btn:hover,
      .chip:hover {
        border-color: var(--accent);
      }
      details.cmt {
        border: 1px solid var(--line);
        border-left: 4px solid var(--nitpick);
        border-radius: 8px;
        margin: 8px 0;
        background: var(--panel);
      }
      details.cmt.s-critical {
        border-left-color: var(--critical);
      }
      details.cmt.s-major {
        border-left-color: var(--major);
      }
      details.cmt.s-minor {
        border-left-color: var(--minor);
      }
      details > summary {
        cursor: pointer;
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      details.cmt > summary {
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .ct {
        font-weight: 600;
        flex: 1 1 260px;
      }
      .loc {
        color: var(--muted);
        font-size: 12px;
        word-break: break-all;
      }
      .cid {
        color: var(--muted);
        font-size: 11px;
      }
      .cb {
        padding: 2px 14px 12px;
        border-top: 1px solid var(--line);
      }
      .lbl {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        margin: 10px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      pre.code,
      pre.diff {
        background: var(--soft);
        border-radius: 8px;
        padding: 9px 12px;
        overflow-x: auto;
        margin: 6px 0;
        white-space: pre;
      }
      pre.diff {
        padding: 7px 0;
      }
      pre.diff span {
        display: block;
        padding: 0 12px;
      }
      pre.diff .a {
        background: var(--add);
        color: var(--add-ink);
      }
      pre.diff .d {
        background: var(--del);
        color: var(--del-ink);
      }
      pre.diff .h {
        background: var(--hunk);
        color: var(--muted);
      }
      h3.file {
        display: flex;
        gap: 8px;
        align-items: center;
        word-break: break-all;
        margin: 16px 0 6px;
      }
      .group > summary h2 {
        margin: 0;
      }
      .group[open] > summary {
        margin-bottom: 8px;
      }
      ul.clean {
        list-style: none;
        padding: 0;
        margin: 6px 0;
      }
      ul.clean li {
        padding: 4px 0;
      }
      .alert {
        border-left: 3px solid var(--major);
        padding: 8px 12px;
        background: var(--soft);
        border-radius: 6px;
        margin: 6px 0;
      }
      .alert.info {
        border-left-color: var(--info);
      }
      .tl {
        border-left: 2px solid var(--line);
        margin: 4px 0 0 6px;
        padding-left: 14px;
      }
      .tl .ev {
        position: relative;
        padding: 4px 0 10px;
      }
      .tl .ev:before {
        content: "";
        position: absolute;
        left: -20px;
        top: 9px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
      }
      .tl .ev.ready:before {
        background: var(--ok);
      }
      .tl .ev.blocked:before {
        background: var(--critical);
      }
      .hbar {
        display: grid;
        grid-template-columns: minmax(90px, 38%) 1fr 44px;
        gap: 8px;
        align-items: center;
        margin: 5px 0;
        font-size: 13px;
      }
      .hbar .lab {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hbar .track {
        background: var(--soft);
        border-radius: 4px;
        height: 10px;
        overflow: hidden;
        display: flex;
      }
      .hbar .fill {
        height: 100%;
      }
      .hbar .val {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin: 4px 0 8px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .kpi b {
        display: block;
        font-size: 24px;
        line-height: 1.1;
        margin-top: 2px;
      }
      .std {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin: 8px 0;
        background: var(--panel);
      }
      .std .head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .std .t {
        font-weight: 600;
      }
      input.search,
      select {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 7px;
        padding: 6px 9px;
        font: inherit;
        font-size: 13px;
      }
      .empty {
        color: var(--muted);
        padding: 6px 0;
      }
      .hidden {
        display: none !important;
      }
      svg text {
        fill: var(--muted);
        font-size: 10px;
      }
      @media (max-width: 640px) {
        th,
        td {
          padding: 7px 5px;
        }
        .sec {
          padding: 14px;
        }
        .hbar {
          grid-template-columns: minmax(70px, 40%) 1fr 36px;
        }
        nav {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <div class="brand" id="brand">Code review</div>
        <nav id="nav">
          <a href="#/" data-v="home">Overview</a>
          <a href="#/branch" data-v="branch">Branch</a>
          <a href="#/standards" data-v="standards">Standards</a>
          <a href="#/insights" data-v="insights">Insights</a>
          <a href="#/help" data-v="help">Help</a>
        </nav>
      </div>
    </header>
    <main id="app"><p class="muted">Loading…</p></main>

    <script>
      window.CRR = {
        files: [],
        branches: [],
        standards: [],
        stdlog: [],
        config: null,
        local: null,
        missing: [],
      };
      function CRR_FILE(p) {
        if (CRR.files.indexOf(p) < 0) CRR.files.push(p);
      }
      function CRR_LOAD(kind, obj) {
        if (kind === "branch") CRR.branches.push(obj);
        else if (kind === "standard") CRR.standards.push(obj);
        else if (kind === "stdlog") CRR.stdlog.push(obj);
        else if (kind === "config") CRR.config = obj;
        else if (kind === "local") CRR.local = obj;
      }
    </script>
    <script
      src="data/index.js"
      onerror="CRR.missing.push('data/index.js')"
    ></script>
    <script
      src="data/config.js"
      onerror="CRR.missing.push('data/config.js')"
    ></script>
    <script src=".tmp/local.js" onerror="/* optional, per-worktree */"></script>
    <script>
      (function () {
        "use strict";
        var SEV = ["critical", "major", "minor", "nitpick"];
        var SEV_LABEL = {
          critical: "Critical",
          major: "Major",
          minor: "Minor",
          nitpick: "Nitpick",
        };
        var SEV_COLOR = {
          critical: "var(--critical)",
          major: "var(--major)",
          minor: "var(--minor)",
          nitpick: "var(--nitpick)",
        };
        var PALETTE = [
          "var(--c1)",
          "var(--c2)",
          "var(--c3)",
          "var(--c4)",
          "var(--c5)",
          "var(--c6)",
        ];
        var app = document.getElementById("app");

        // ---------------------------------------------------------------- loading
        function loadAll(done) {
          var list = CRR.files.slice(),
            i = 0;
          (function next() {
            if (i >= list.length) return done();
            var s = document.createElement("script");
            var f = list[i++];
            s.src = "data/" + f;
            s.onload = next;
            s.onerror = function () {
              CRR.missing.push(f);
              next();
            };
            document.body.appendChild(s);
          })();
        }

        // ---------------------------------------------------------------- helpers
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function inl(s) {
          s = esc(s);
          s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
          s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          s = s.replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g, "$1<em>$2</em>");
          s = s.replace(
            /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>',
          );
          s = s.replace(
            /\b(STD-[0-9a-f]{4})\b/g,
            '<a href="#/standards/$1">$1</a>',
          );
          return s;
        }
        function md(text) {
          if (!text) return "";
          var out = [],
            para = [],
            list = null,
            code = null,
            lang = "";
          function fp() {
            if (para.length) {
              out.push("<p>" + para.map(inl).join(" ") + "</p>");
              para = [];
            }
          }
          function fl() {
            if (list) {
              out.push(
                "<" +
                  list.t +
                  ">" +
                  list.items
                    .map(function (x) {
                      return "<li>" + inl(x) + "</li>";
                    })
                    .join("") +
                  "</" +
                  list.t +
                  ">",
              );
              list = null;
            }
          }
          String(text)
            .split("\n")
            .forEach(function (line) {
              var t = line.trim();
              if (t.indexOf("```") === 0) {
                if (code) {
                  out.push(
                    lang === "diff"
                      ? diffHtml(code.join("\n"))
                      : '<pre class="code">' + esc(code.join("\n")) + "</pre>",
                  );
                  code = null;
                } else {
                  fp();
                  fl();
                  code = [];
                  lang = t.slice(3).trim().toLowerCase();
                }
                return;
              }
              if (code) {
                code.push(line);
                return;
              }
              var ul = /^\s*[-*]\s+(.*)/.exec(line),
                ol = /^\s*\d+[.)]\s+(.*)/.exec(line),
                h = /^#{1,4}\s+(.*)/.exec(line);
              if (h) {
                fp();
                fl();
                out.push("<h3>" + inl(h[1]) + "</h3>");
              } else if (ul || ol) {
                fp();
                var tg = ul ? "ul" : "ol";
                if (!list || list.t !== tg) {
                  fl();
                  list = { t: tg, items: [] };
                }
                list.items.push((ul || ol)[1]);
              } else if (!t) {
                fp();
                fl();
              } else {
                fl();
                para.push(t);
              }
            });
          if (code)
            out.push('<pre class="code">' + esc(code.join("\n")) + "</pre>");
          fp();
          fl();
          return out.join("");
        }
        function diffHtml(s) {
          return (
            '<pre class="diff">' +
            String(s)
              .replace(/\n$/, "")
              .split("\n")
              .map(function (l) {
                var c =
                  l.indexOf("@@") === 0
                    ? "h"
                    : l[0] === "+" && l.indexOf("+++") !== 0
                      ? "a"
                      : l[0] === "-" && l.indexOf("---") !== 0
                        ? "d"
                        : "";
                return '<span class="' + c + '">' + (esc(l) || " ") + "</span>";
              })
              .join("") +
            "</pre>"
          );
        }
        function logKey(l) {
          return String(l.seq || l.at || "");
        }
        function fmtDate(s) {
          return s ? String(s).replace("T", " ").slice(0, 16) : "—";
        }
        function day(s) {
          return s ? String(s).slice(0, 10) : "";
        }
        function loc(c) {
          var s = c.file;
          if (c.line_start) {
            s += ":" + c.line_start;
            if (c.line_end && c.line_end !== c.line_start)
              s += "-" + c.line_end;
          }
          return s;
        }
        function sevBadge(s) {
          return (
            '<span class="badge sev-' + s + '">' + SEV_LABEL[s] + "</span>"
          );
        }
        function verdictBadge(v) {
          return v === "ready"
            ? '<span class="badge ok">✓ Ready</span>'
            : v === "blocked"
              ? '<span class="badge bad">✕ Blocked</span>'
              : '<span class="badge muted">—</span>';
        }
        function openC(b) {
          return (b.comments || []).filter(function (c) {
            return c.status === "open";
          });
        }
        function bySev(list) {
          var o = { critical: 0, major: 0, minor: 0, nitpick: 0 };
          list.forEach(function (c) {
            o[c.severity] = (o[c.severity] || 0) + 1;
          });
          return o;
        }
        function stdById(id) {
          for (var i = 0; i < CRR.standards.length; i++)
            if (CRR.standards[i].id === id) return CRR.standards[i];
          return null;
        }
        function checkName(id) {
          var cs = (CRR.config && CRR.config.checks) || [];
          for (var i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i];
          return { id: id, name: id };
        }
        function isCurrent(b) {
          return CRR.local && CRR.local.current_slug === b.slug;
        }
        function isLocal(b) {
          return (
            !CRR.local ||
            (CRR.local.local_branches || []).indexOf(b.branch) >= 0
          );
        }
        function reviewRuns(b) {
          return (b.runs || []).filter(function (r) {
            return r.kind !== "status";
          });
        }
        function today() {
          return new Date().toISOString().slice(0, 10);
        }
        function excState(e) {
          return e.expires && e.expires < today() ? "expired" : "active";
        }
        function hbars(rows, opts) {
          opts = opts || {};
          if (!rows.length) return '<p class="empty">No data yet.</p>';
          var max =
            Math.max.apply(
              null,
              rows.map(function (r) {
                return r.total != null ? r.total : r.value;
              }),
            ) || 1;
          return rows
            .map(function (r) {
              var segs = r.segments || [
                { value: r.value, color: r.color || "var(--c1)" },
              ];
              var total = r.total != null ? r.total : r.value;
              return (
                '<div class="hbar"><div class="lab" title="' +
                esc(r.title || r.label) +
                '">' +
                (r.html || esc(r.label)) +
                '</div><div class="track">' +
                segs
                  .map(function (s) {
                    return (
                      '<div class="fill" style="width:' +
                      (100 * s.value) / max +
                      "%;background:" +
                      s.color +
                      '" title="' +
                      esc(s.name || "") +
                      " " +
                      s.value +
                      '"></div>'
                    );
                  })
                  .join("") +
                '</div><div class="val">' +
                (opts.fmt ? opts.fmt(total) : total) +
                "</div></div>"
              );
            })
            .join("");
        }
        function legend(items) {
          return (
            '<div class="legend">' +
            items
              .map(function (i) {
                return (
                  '<span><i style="background:' +
                  i.color +
                  '"></i>' +
                  esc(i.name) +
                  "</span>"
                );
              })
              .join("") +
            "</div>"
          );
        }
        function columns(series, opts) {
          // series: [{label, segments:[{value,color,name}]}] -> SVG stacked columns
          if (!series.length) return '<p class="empty">No data yet.</p>';
          var H = 150,
            pad = 22,
            bw = 30,
            W = pad + series.length * bw + 4;
          var max =
            Math.max.apply(
              null,
              series.map(function (s) {
                return s.segments.reduce(function (a, x) {
                  return a + x.value;
                }, 0);
              }),
            ) || 1;
          var g = series
            .map(function (s, i) {
              var y = H - pad,
                x = pad + i * bw + 2,
                w = Math.max(3, bw - 4);
              var rects = s.segments
                .map(function (seg) {
                  var h = ((H - pad - 6) * seg.value) / max;
                  y -= h;
                  return h > 0
                    ? '<rect x="' +
                        x +
                        '" y="' +
                        y +
                        '" width="' +
                        w +
                        '" height="' +
                        h +
                        '" rx="2" fill="' +
                        seg.color +
                        '"><title>' +
                        esc(s.label + " · " + seg.name + ": " + seg.value) +
                        "</title></rect>"
                    : "";
                })
                .join("");
              var showLab =
                s.short && (i === 0 || series[i - 1].short !== s.short);
              var lab = showLab
                ? '<text x="' +
                  x +
                  '" y="' +
                  (H - 6) +
                  '">' +
                  esc(s.short) +
                  "</text>"
                : "";
              return rects + lab;
            })
            .join("");
          return (
            '<div class="scroll"><svg viewBox="0 0 ' +
            W +
            " " +
            H +
            '" width="' +
            W +
            '" height="' +
            H +
            '" style="max-width:100%;height:auto;overflow:visible" role="img">' +
            '<text x="2" y="12">' +
            max +
            '</text><line x1="' +
            pad +
            '" y1="' +
            (H - pad) +
            '" x2="' +
            W +
            '" y2="' +
            (H - pad) +
            '" stroke="var(--line)"/>' +
            g +
            "</svg></div>"
          );
        }
        function copyText(t, btn) {
          var done = function () {
            var o = btn.textContent;
            btn.textContent = "Copied ✓";
            setTimeout(function () {
              btn.textContent = o;
            }, 1300);
          };
          if (navigator.clipboard && window.isSecureContext)
            navigator.clipboard.writeText(t).then(done, fb);
          else fb();
          function fb() {
            var ta = document.createElement("textarea");
            ta.value = t;
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              done();
            } catch (e) {}
            ta.remove();
          }
        }
        var COPY = {};
        function copyBtn(text, label) {
          var k = "c" + Object.keys(COPY).length;
          COPY[k] = text;
          return (
            '<button class="btn" data-copy="' +
            k +
            '">' +
            esc(label || "Copy") +
            "</button>"
          );
        }

        // ---------------------------------------------------------------- alerts
        function globalAlerts() {
          var a = [],
            proposed = CRR.standards.filter(function (s) {
              return s.status === "proposed";
            });
          if (proposed.length)
            a.push({
              cls: "info",
              html:
                "<b>" +
                proposed.length +
                '</b> proposed standard(s) waiting for your validation. <a href="#/standards?f=proposed">Review</a>',
            });
          CRR.standards.forEach(function (s) {
            if (
              s.divergence &&
              (s.status === "active" || s.status === "deprecated")
            )
              a.push({
                html:
                  '<a href="#/standards/' +
                  s.id +
                  '">' +
                  s.id +
                  "</a> " +
                  esc(s.title) +
                  " — <b>diverges from its source</b> " +
                  (s.source && s.source.file
                    ? "<code>" + esc(s.source.file) + "</code>"
                    : "") +
                  ". " +
                  inl(s.divergence.note || ""),
              });
            (s.exceptions || []).forEach(function (e) {
              if (excState(e) === "expired")
                a.push({
                  html:
                    "Exception expired on " +
                    esc(e.expires) +
                    ' for <a href="#/standards/' +
                    s.id +
                    '">' +
                    s.id +
                    "</a> in <code>" +
                    esc(e.path) +
                    "</code>. Renew or remove it.",
                });
            });
          });
          if (CRR.missing.length)
            a.push({
              html:
                "Some data files could not be loaded: <code>" +
                CRR.missing.map(esc).join("</code>, <code>") +
                "</code>. Run <code>crr.py index</code>.",
            });
          return a;
        }
        function alertsHtml(list) {
          return list
            .map(function (x) {
              return (
                '<div class="alert ' + (x.cls || "") + '">' + x.html + "</div>"
              );
            })
            .join("");
        }

        // ---------------------------------------------------------------- views
        function viewHome() {
          var bs = CRR.branches.slice().sort(function (a, b) {
            return (
              isCurrent(b) - isCurrent(a) ||
              String(b.updated_at).localeCompare(String(a.updated_at))
            );
          });
          var cur = bs.filter(isCurrent)[0];
          var h =
            "<h1>" + esc((CRR.local && CRR.local.repo) || "Project") + "</h1>";
          h +=
            '<p class="muted small">' +
            bs.length +
            " branch(es) with reviews · " +
            CRR.standards.filter(function (s) {
              return s.status === "active";
            }).length +
            " active standards</p>";
          h += alertsHtml(globalAlerts());
          if (cur) {
            var o = bySev(openC(cur));
            h +=
              '<div class="sec"><h2>Current branch <code>' +
              esc(cur.branch) +
              "</code></h2>" +
              verdictBlock(cur) +
              '<p class="small muted" style="margin-top:10px">Open: ' +
              SEV.map(function (s) {
                return (
                  '<span class="sev-' + s + '">' + o[s] + " " + s + "</span>"
                );
              }).join(" · ") +
              " · last review " +
              fmtDate(cur.last_review && cur.last_review.at) +
              ' · <a href="#/branch/' +
              encodeURIComponent(cur.slug) +
              '">Open branch →</a></p></div>';
          } else if (CRR.local) {
            h +=
              '<div class="sec"><h2>Current branch <code>' +
              esc(CRR.local.current_branch) +
              '</code></h2><p class="muted">Not reviewed yet. Ask your agent: “review my changes”.</p></div>';
          }
          h +=
            '<div class="sec"><h2>Branches <span class="n">' +
            bs.length +
            '</span></h2><div class="scroll"><table><thead><tr><th>Branch</th><th>Verdict</th><th>Open</th><th>Reviews</th><th>Last review</th><th>State</th></tr></thead><tbody>';
          if (!bs.length)
            h += '<tr><td colspan="6" class="empty">No reviews yet.</td></tr>';
          bs.forEach(function (b) {
            var o = bySev(openC(b));
            h +=
              '<tr class="click' +
              (isCurrent(b) ? " current" : "") +
              '" data-href="#/branch/' +
              encodeURIComponent(b.slug) +
              '"><td><code>' +
              esc(b.branch) +
              "</code>" +
              (isCurrent(b) ? ' <span class="badge">current</span>' : "") +
              "</td><td>" +
              verdictBadge(b.verdict) +
              "</td><td>" +
              SEV.map(function (s) {
                return o[s]
                  ? '<span class="sev-' +
                      s +
                      '">' +
                      o[s] +
                      s[0].toUpperCase() +
                      "</span>"
                  : "";
              })
                .filter(Boolean)
                .join(" ") +
              (openC(b).length ? "" : '<span class="muted">0</span>') +
              "</td><td>" +
              reviewRuns(b).length +
              "</td><td>" +
              fmtDate(b.last_review && b.last_review.at) +
              "</td><td>" +
              (isLocal(b)
                ? "active"
                : '<span class="muted">historical</span>') +
              "</td></tr>";
          });
          h += "</tbody></table></div></div>";
          var runs = allRuns().slice(-40);
          h +=
            '<div class="sec"><h2>Findings per review</h2>' +
            legend(
              SEV.map(function (s) {
                return { name: SEV_LABEL[s], color: SEV_COLOR[s] };
              }),
            ) +
            columns(
              runs.map(function (r) {
                return {
                  label: r.branch + " #" + r.n + " · " + fmtDate(r.at),
                  short: day(r.at).slice(5),
                  segments: SEV.map(function (s) {
                    return {
                      name: s,
                      value: r.newBySev[s],
                      color: SEV_COLOR[s],
                    };
                  }),
                };
              }),
            ) +
            '<p class="small muted">New findings raised in each review run (all branches, chronological). <a href="#/insights">More insights →</a></p></div>';
          return h;
        }

        function verdictBlock(b) {
          var o = openC(b),
            blocking = o.filter(function (c) {
              return c.severity === "critical" || c.severity === "major";
            });
          var checks = (b.checks_latest || []).filter(function (r) {
            return r.status === "fail" && checkName(r.id).blocking;
          });
          var n = blocking.length + checks.length;
          if (!b.verdict)
            return '<div class="verdict"><span class="muted">No review yet</span></div>';
          return (
            '<div class="verdict ' +
            (n ? "blocked" : "ready") +
            '"><span class="big">' +
            (n ? "✕" : "✓") +
            "</span><div>" +
            (n ? n + " blocker(s) — not ready to commit" : "Ready to commit") +
            '<div class="small muted" style="font-weight:400">' +
            (n
              ? blocking
                  .map(function (c) {
                    return c.id;
                  })
                  .concat(
                    checks.map(function (r) {
                      return "check: " + r.id;
                    }),
                  )
                  .join(" · ")
              : "No critical/major comments and no blocking checks failing.") +
            "</div></div></div>"
          );
        }

        function commentHtml(c, closed) {
          var std = c.standard ? stdById(c.standard) : null;
          var prompt =
            c.agent_prompt ||
            "In " + loc(c) + ": " + c.title + ". " + (c.body || "");
          var h =
            '<details class="cmt s-' +
            c.severity +
            '" data-sev="' +
            c.severity +
            '"' +
            (!closed && c.severity !== "nitpick" ? " open" : "") +
            "><summary>" +
            sevBadge(c.severity) +
            '<span class="badge">' +
            esc(c.category || "other") +
            "</span>" +
            (c.standard
              ? '<a class="badge" href="#/standards/' +
                c.standard +
                '" title="' +
                esc(std ? std.title : "") +
                '">' +
                c.standard +
                "</a>"
              : "") +
            '<span class="ct">' +
            inl(c.title) +
            '</span><span class="loc mono">' +
            esc(loc(c)) +
            "</span>" +
            (closed
              ? '<span class="badge ' +
                (c.status === "resolved" ? "ok" : "muted") +
                '">' +
                esc(c.status) +
                "</span>"
              : "") +
            '<span class="cid mono">' +
            esc(c.id) +
            '</span></summary><div class="cb">' +
            md(c.body);
          if (c.suggestion)
            h +=
              '<div class="lbl">Suggested change</div>' +
              (/^[+-]/m.test(c.suggestion)
                ? diffHtml(c.suggestion)
                : '<pre class="code">' + esc(c.suggestion) + "</pre>");
          h +=
            '<details style="margin-top:8px"><summary class="small muted"><b>🤖 Prompt for AI agents</b></summary><pre class="code" style="white-space:pre-wrap">' +
            esc(prompt) +
            "</pre>" +
            copyBtn(prompt) +
            "</details>";
          h +=
            '<div class="small muted" style="margin-top:8px">Raised in review #' +
            (c.created_run || "?") +
            (c.closed_run ? " · closed in #" + c.closed_run : "") +
            (c.resolution ? " · " + inl(c.resolution) : "") +
            "</div></div></details>";
          return h;
        }

        function viewBranch(slug) {
          var b = CRR.branches.filter(function (x) {
            return x.slug === slug;
          })[0];
          if (!b && !slug)
            b =
              CRR.branches.filter(isCurrent)[0] ||
              CRR.branches.slice().sort(function (a, c) {
                return String(c.updated_at).localeCompare(String(a.updated_at));
              })[0];
          if (!b)
            return "<h1>Branch</h1><p class='muted'>No reviewed branch found.</p>";
          var h =
            '<p class="small muted"><a href="#/">Overview</a> / branch</p><h1><code>' +
            esc(b.branch) +
            "</code>" +
            (isCurrent(b) ? ' <span class="badge">current</span>' : "") +
            "</h1>";
          h +=
            '<p class="small muted">base <code>' +
            esc(b.base || "—") +
            "</code> · " +
            reviewRuns(b).length +
            " review(s) · last " +
            fmtDate(b.last_review && b.last_review.at) +
            (isLocal(b) ? "" : " · historical") +
            "</p>";
          h += verdictBlock(b);
          if (b.suggestions && b.suggestions.length)
            h += alertsHtml(
              b.suggestions.map(function (s) {
                return { cls: "info", html: "💡 " + inl(s.text) };
              }),
            );
          var s = b.summary;
          if (s) {
            h +=
              '<div class="sec"><h2>Summary</h2>' +
              md(s.text || "") +
              ((s.highlights || []).length
                ? '<ul class="clean">' +
                  s.highlights
                    .map(function (x) {
                      return (
                        '<li><span class="badge">' +
                        esc(x.type) +
                        "</span> " +
                        inl(x.text) +
                        "</li>"
                      );
                    })
                    .join("") +
                  "</ul>"
                : "") +
              "</div>";
          }
          var side = "";
          if (b.commit_message)
            side +=
              '<div class="card"><h3 style="margin-top:0">Proposed commit message</h3><pre class="code" style="white-space:pre-wrap">' +
              esc(b.commit_message) +
              "</pre>" +
              copyBtn(b.commit_message) +
              "</div>";
          if (b.effort)
            side +=
              '<div class="card"><h3 style="margin-top:0">Estimated review effort</h3><div style="font-size:22px;font-weight:700">' +
              esc(b.effort.score) +
              '<span class="muted" style="font-size:14px">/5' +
              (b.effort.minutes
                ? " · ~" + esc(b.effort.minutes) + " min"
                : "") +
              "</span></div>" +
              md(b.effort.reason || "") +
              "</div>";
          if ((b.checks_latest || []).length) {
            var ic = {
              pass: '<span class="ok">✓</span>',
              warn: '<span class="warn">!</span>',
              fail: '<span class="bad">✕</span>',
              "n/a": '<span class="muted">–</span>',
            };
            var order = { fail: 0, warn: 1, pass: 2, "n/a": 3 };
            var rows = b.checks_latest.slice().sort(function (x, y) {
              return order[x.status] - order[y.status];
            });
            var li = function (r) {
              var c = checkName(r.id);
              return (
                "<li>" +
                ic[r.status] +
                " " +
                esc(c.name || r.id) +
                (c.blocking ? ' <span class="badge">blocking</span>' : "") +
                (r.note && r.status !== "pass" && r.status !== "n/a"
                  ? '<div class="muted">' + inl(r.note) + "</div>"
                  : "") +
                "</li>"
              );
            };
            var issues = rows.filter(function (r) {
              return r.status === "fail" || r.status === "warn";
            });
            var rest = rows.filter(function (r) {
              return r.status === "pass" || r.status === "n/a";
            });
            var np = rest.filter(function (r) {
              return r.status === "pass";
            }).length;
            side +=
              '<div class="card"><h3 style="margin-top:0">Checks</h3><ul class="clean small">' +
              (issues.length
                ? issues.map(li).join("")
                : '<li class="ok">✓ No check failing or warning</li>') +
              "</ul>" +
              '<details><summary class="small muted">' +
              np +
              " passed · " +
              (rest.length - np) +
              ' not applicable</summary><ul class="clean small">' +
              rest.map(li).join("") +
              "</ul></details></div>";
          }
          if (side) h += '<div class="grid">' + side + "</div>";
          var w = b.walkthrough;
          if (w) {
            h += '<div class="sec"><h2>Walkthrough</h2>' + md(w.overview || "");
            if ((w.changes || []).length)
              h +=
                '<div class="scroll"><table><thead><tr><th>Cohort / files</th><th>Summary</th></tr></thead><tbody>' +
                w.changes
                  .map(function (c) {
                    return (
                      "<tr><td>" +
                      (c.cohort ? "<b>" + inl(c.cohort) + "</b><br>" : "") +
                      (c.files || [])
                        .map(function (f) {
                          return "<code>" + esc(f) + "</code>";
                        })
                        .join("<br>") +
                      "</td><td>" +
                      md(c.summary) +
                      "</td></tr>"
                    );
                  })
                  .join("") +
                "</tbody></table></div>";
            h += "</div>";
          }
          if (b.diagram)
            h +=
              '<div class="sec"><h2>Sequence diagram</h2><div class="scroll"><pre class="mermaid">' +
              esc(b.diagram) +
              "</pre></div></div>";
          var open = openC(b).sort(function (x, y) {
            return (
              SEV.indexOf(x.severity) - SEV.indexOf(y.severity) ||
              x.file.localeCompare(y.file)
            );
          });
          var act = open.filter(function (c) {
              return c.severity !== "nitpick";
            }),
            nits = open.filter(function (c) {
              return c.severity === "nitpick";
            });
          var closed = (b.comments || []).filter(function (c) {
            return c.status !== "open";
          });
          var allPrompt = open.length
            ? "Verify each finding against the current code and only fix it if it is still valid.\n\n" +
              open
                .map(function (c) {
                  return (
                    "- [" +
                    c.severity +
                    "] " +
                    (c.agent_prompt || "In " + loc(c) + ": " + c.title)
                  );
                })
                .join("\n")
            : "";
          var counts = bySev(open);
          h +=
            '<div class="sec" id="comments"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2>Comments <span class="n">' +
            act.length +
            "</span></h2>" +
            (open.length
              ? copyBtn(allPrompt, "🤖 Copy prompt for all open comments")
              : "") +
            "</div>";
          h +=
            '<div class="chips"><button class="chip on" data-f="all">All · ' +
            act.length +
            "</button>" +
            ["critical", "major", "minor"]
              .map(function (s) {
                return (
                  '<button class="chip" data-f="' +
                  s +
                  '"><span class="sev-' +
                  s +
                  '">●</span> ' +
                  counts[s] +
                  " " +
                  SEV_LABEL[s] +
                  "</button>"
                );
              })
              .join("") +
            "</div>";
          if (!act.length)
            h += '<p class="empty">No open actionable comments.</p>';
          var cur = null;
          act.forEach(function (c) {
            if (c.file !== cur) {
              cur = c.file;
              h +=
                '<h3 class="file" data-file>📄 <code>' +
                esc(cur) +
                "</code></h3>";
            }
            h += commentHtml(c);
          });
          h += "</div>";
          if (nits.length)
            h +=
              '<div class="sec"><details class="group"><summary><h2>Nitpicks <span class="n">' +
              nits.length +
              "</span></h2></summary>" +
              nits
                .map(function (c) {
                  return commentHtml(c);
                })
                .join("") +
              "</details></div>";
          if (closed.length)
            h +=
              '<div class="sec"><details class="group"><summary><h2>Resolved, dismissed & excepted <span class="n">' +
              closed.length +
              "</span></h2></summary>" +
              closed
                .map(function (c) {
                  return commentHtml(c, true);
                })
                .join("") +
              "</details></div>";
          h +=
            '<div class="sec"><h2>Review timeline</h2><div class="tl">' +
            (b.runs || [])
              .slice()
              .reverse()
              .map(function (r) {
                var c = r.counts || {};
                return (
                  '<div class="ev ' +
                  (r.verdict || "") +
                  '"><b>#' +
                  r.n +
                  "</b> · " +
                  fmtDate(r.at) +
                  ' · <span class="badge">' +
                  esc(r.kind) +
                  "</span> " +
                  verdictBadge(r.verdict) +
                  '<div class="small muted">+' +
                  (c["new"] || 0) +
                  " new · " +
                  (c.resolved || 0) +
                  " resolved · " +
                  (c.dismissed || 0) +
                  " dismissed · " +
                  (c.excepted || 0) +
                  " excepted · " +
                  (c.reopened || 0) +
                  " reopened" +
                  (r.files_reviewed != null
                    ? " · " + r.files_reviewed + " file(s)"
                    : "") +
                  (r.head
                    ? ' · <span class="mono">' +
                      esc(String(r.head).slice(0, 8)) +
                      "</span>"
                    : "") +
                  (r.agent ? " · " + esc(r.agent) : "") +
                  "</div>" +
                  (r.note
                    ? '<div class="small">' + inl(r.note) + "</div>"
                    : "") +
                  "</div>"
                );
              })
              .join("") +
            "</div></div>";
          return h;
        }

        function stdCard(s) {
          var viol = 0;
          CRR.branches.forEach(function (b) {
            (b.comments || []).forEach(function (c) {
              if (c.standard === s.id) viol++;
            });
          });
          var lvl =
            {
              required: "sev-major",
              recommended: "sev-minor",
              preference: "sev-nitpick",
            }[s.level] || "";
          var h =
            '<div class="std" id="' +
            s.id +
            '" data-status="' +
            esc(s.status) +
            '" data-cat="' +
            esc(s.category) +
            '" data-q="' +
            esc((s.id + " " + s.title + " " + s.description).toLowerCase()) +
            '"><div class="head">' +
            '<span class="mono muted">' +
            s.id +
            '</span><span class="t">' +
            inl(s.title) +
            '</span><span class="badge ' +
            lvl +
            '">' +
            esc(s.level) +
            '</span><span class="badge">' +
            esc(s.status) +
            '</span><span class="badge">' +
            esc(s.category) +
            "</span>" +
            '<span class="badge muted">' +
            esc(s.origin) +
            "</span>" +
            (s.divergence ? '<span class="badge bad">divergent</span>' : "") +
            "</div>";
          h += md(s.description);
          var meta = [];
          if (s.source && s.source.file)
            meta.push(
              "Source: <code>" +
                esc(s.source.file) +
                "</code>" +
                (s.source.detail ? " — " + inl(s.source.detail) : ""),
            );
          if (s.scope && (s.scope.paths || []).length)
            meta.push(
              "Scope: " +
                s.scope.paths
                  .map(function (p) {
                    return "<code>" + esc(p) + "</code>";
                  })
                  .join(" "),
            );
          if (s.prevalence) meta.push("Prevalence: " + inl(s.prevalence));
          if (s.replaced_by)
            meta.push(
              'Replaced by <a href="#/standards/' +
                esc(s.replaced_by) +
                '">' +
                esc(s.replaced_by) +
                "</a>",
            );
          if (s.migration)
            meta.push(
              "Migration: <b>" +
                esc(s.migration.remaining) +
                "</b> usage(s) of the old pattern remaining (" +
                day(s.migration.measured_at) +
                ")",
            );
          meta.push(viol + " comment(s) cited this standard");
          h += '<div class="small muted">' + meta.join(" · ") + "</div>";
          if (s.divergence)
            h += '<div class="alert">' + inl(s.divergence.note) + "</div>";
          if ((s.examples || []).length)
            h +=
              '<div class="lbl">Examples</div><ul class="clean small">' +
              s.examples
                .map(function (e) {
                  return (
                    "<li><code>" +
                    esc(e.file || e) +
                    "</code>" +
                    (e.note ? " — " + inl(e.note) : "") +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>";
          if ((s.exceptions || []).length)
            h +=
              '<div class="lbl">Exceptions</div><ul class="clean small">' +
              s.exceptions
                .map(function (e) {
                  return (
                    "<li><code>" +
                    esc(e.path) +
                    "</code> — " +
                    inl(e.reason) +
                    (e.expires
                      ? ' <span class="badge ' +
                        (excState(e) === "expired" ? "bad" : "") +
                        '">' +
                        (excState(e) === "expired" ? "expired " : "until ") +
                        esc(e.expires) +
                        "</span>"
                      : "") +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>";
          var log = CRR.stdlog
            .filter(function (l) {
              return l.standard === s.id;
            })
            .sort(function (a, b) {
              return logKey(b).localeCompare(logKey(a));
            });
          if (log.length)
            h +=
              '<details style="margin-top:6px"><summary class="small muted">History (' +
              log.length +
              ")</summary>" +
              '<ul class="clean small">' +
              log
                .map(function (l) {
                  return (
                    "<li>" +
                    fmtDate(l.at) +
                    " · <b>" +
                    esc(l.action) +
                    "</b>" +
                    (l.reason ? " — " + inl(l.reason) : "") +
                    (l.branch
                      ? ' <span class="muted">(' +
                        esc(l.branch) +
                        (l.run ? " #" + l.run : "") +
                        ")</span>"
                      : "") +
                    "</li>"
                  );
                })
                .join("") +
              "</ul></details>";
          return h + "</div>";
        }

        function viewStandards(focus, filter) {
          var st = CRR.standards.slice().sort(function (a, b) {
            return (
              a.category.localeCompare(b.category) ||
              a.title.localeCompare(b.title)
            );
          });
          var count = function (k) {
            return st.filter(function (s) {
              return s.status === k;
            }).length;
          };
          var cats = Array.from(
            new Set(
              st.map(function (s) {
                return s.category;
              }),
            ),
          ).sort();
          var h =
            "<h1>Standards</h1><p class='small muted'>The project's catalog. Proposed standards are not enforced until you validate them.</p>" +
            alertsHtml(globalAlerts());
          h +=
            '<div class="chips">' +
            ["active", "proposed", "deprecated", "rejected", "all"]
              .map(function (k) {
                return (
                  '<button class="chip' +
                  ((filter || "active") === k ? " on" : "") +
                  '" data-sf="' +
                  k +
                  '">' +
                  k +
                  (k !== "all" ? " · " + count(k) : "") +
                  "</button>"
                );
              })
              .join("") +
            '<select id="scat"><option value="">All categories</option>' +
            cats
              .map(function (c) {
                return "<option>" + esc(c) + "</option>";
              })
              .join("") +
            '</select> <input class="search" id="sq" placeholder="Search…"></div>';
          h +=
            '<div id="stdlist">' +
            (st.length
              ? st.map(stdCard).join("")
              : '<p class="empty">No standards yet. Ask your agent to analyze the project standards.</p>') +
            "</div>";
          var log = CRR.stdlog
            .slice()
            .sort(function (a, b) {
              return logKey(b).localeCompare(logKey(a));
            })
            .slice(0, 30);
          h +=
            '<div class="sec"><h2>Recent changes</h2>' +
            (log.length
              ? '<ul class="clean small">' +
                log
                  .map(function (l) {
                    var s = stdById(l.standard);
                    return (
                      "<li>" +
                      fmtDate(l.at) +
                      ' · <a href="#/standards/' +
                      l.standard +
                      '">' +
                      l.standard +
                      "</a> " +
                      esc(s ? s.title : "") +
                      " · <b>" +
                      esc(l.action) +
                      "</b>" +
                      (l.reason ? " — " + inl(l.reason) : "") +
                      "</li>"
                    );
                  })
                  .join("") +
                "</ul>"
              : '<p class="empty">No changes yet.</p>') +
            "</div>";
          setTimeout(function () {
            applyStdFilter(focus ? "all" : filter || "active");
            if (focus) {
              var el = document.getElementById(focus);
              if (el) {
                el.scrollIntoView({ block: "center" });
                el.style.boxShadow = "0 0 0 2px var(--accent)";
              }
            }
          }, 0);
          return h;
        }
        function applyStdFilter(f) {
          var cat = (document.getElementById("scat") || {}).value || "",
            q = (
              (document.getElementById("sq") || {}).value || ""
            ).toLowerCase();
          document.querySelectorAll(".chip[data-sf]").forEach(function (c) {
            c.classList.toggle("on", c.dataset.sf === f);
          });
          document.querySelectorAll("#stdlist .std").forEach(function (el) {
            el.classList.toggle(
              "hidden",
              (f !== "all" && el.dataset.status !== f) ||
                (cat && el.dataset.cat !== cat) ||
                (q && el.dataset.q.indexOf(q) < 0),
            );
          });
        }

        function allRuns() {
          var out = [];
          CRR.branches.forEach(function (b) {
            var created = {};
            (b.comments || []).forEach(function (c) {
              (created[c.created_run] = created[c.created_run] || []).push(c);
            });
            (b.runs || []).forEach(function (r) {
              if (r.kind !== "status")
                out.push(
                  Object.assign(
                    { branch: b.branch, newBySev: bySev(created[r.n] || []) },
                    r,
                  ),
                );
            });
          });
          return out.sort(function (a, b) {
            return String(a.at).localeCompare(String(b.at));
          });
        }

        function viewInsights() {
          var bs = CRR.branches,
            comments = [];
          bs.forEach(function (b) {
            (b.comments || []).forEach(function (c) {
              comments.push(Object.assign({ branch: b.branch }, c));
            });
          });
          var open = comments.filter(function (c) {
            return c.status === "open";
          });
          var runs = allRuns();
          var h =
            "<h1>Insights</h1><p class='small muted'>Computed in your browser from all review data visible in this branch (main + merged branches + this one).</p>";

          // --- Now
          var blocked = bs.filter(function (b) {
            return b.verdict === "blocked";
          });
          var prop = CRR.standards.filter(function (s) {
            return s.status === "proposed";
          }).length;
          var div = CRR.standards.filter(function (s) {
            return s.divergence && s.status !== "rejected";
          }).length;
          var exp = 0;
          CRR.standards.forEach(function (s) {
            (s.exceptions || []).forEach(function (e) {
              if (excState(e) === "expired") exp++;
            });
          });
          h +=
            '<div class="sec"><h2>How is the project now?</h2><div class="kpis">' +
            kpi("Open comments", open.length) +
            kpi("Branches blocked", blocked.length + " / " + bs.length) +
            kpi("Standards to validate", prop) +
            kpi("Divergent standards", div) +
            kpi("Expired exceptions", exp) +
            "</div>";
          h +=
            "<h3>Open comments by branch</h3>" +
            legend(
              SEV.map(function (s) {
                return { name: SEV_LABEL[s], color: SEV_COLOR[s] };
              }),
            ) +
            hbars(
              bs
                .map(function (b) {
                  var o = bySev(openC(b));
                  return {
                    label: b.branch,
                    total: openC(b).length,
                    segments: SEV.map(function (s) {
                      return { name: s, value: o[s], color: SEV_COLOR[s] };
                    }),
                  };
                })
                .filter(function (r) {
                  return r.total;
                })
                .sort(function (a, b) {
                  return b.total - a.total;
                }),
            );
          h += "</div>";

          // --- Where do I fail most
          var bystd = {};
          comments.forEach(function (c) {
            if (c.standard) bystd[c.standard] = (bystd[c.standard] || 0) + 1;
          });
          var bycat = {};
          comments.forEach(function (c) {
            bycat[c.category || "other"] =
              (bycat[c.category || "other"] || 0) + 1;
          });
          var chk = {},
            chkN = {};
          runs.forEach(function (r) {
            (r.checks || []).forEach(function (x) {
              if (x.status === "n/a") return;
              chkN[x.id] = (chkN[x.id] || 0) + 1;
              if (x.status === "fail" || x.status === "warn")
                chk[x.id] = (chk[x.id] || 0) + 1;
            });
          });
          var files = {},
            dirs = {};
          comments.forEach(function (c) {
            files[c.file] = (files[c.file] || 0) + 1;
            var d =
              c.file.indexOf("/") > 0
                ? c.file.slice(0, c.file.lastIndexOf("/"))
                : "(root)";
            dirs[d] = (dirs[d] || 0) + 1;
          });
          var top = function (o, n) {
            return Object.keys(o)
              .map(function (k) {
                return [k, o[k]];
              })
              .sort(function (a, b) {
                return b[1] - a[1];
              })
              .slice(0, n || 10);
          };
          h +=
            '<div class="sec"><h2>Where do I fail most?</h2><div class="grid">';
          h +=
            "<div><h3>Most violated standards</h3>" +
            hbars(
              top(bystd).map(function (x) {
                var s = stdById(x[0]);
                return {
                  label: x[0] + " " + (s ? s.title : ""),
                  html:
                    '<a href="#/standards/' +
                    x[0] +
                    '">' +
                    x[0] +
                    "</a> " +
                    esc(s ? s.title : ""),
                  value: x[1],
                  color: "var(--c2)",
                };
              }),
            ) +
            "</div>";
          h +=
            "<div><h3>Most frequent categories</h3>" +
            hbars(
              top(bycat).map(function (x, i) {
                return {
                  label: x[0],
                  value: x[1],
                  color: PALETTE[i % PALETTE.length],
                };
              }),
            ) +
            "</div>";
          h +=
            "<div><h3>Checks that fail or warn most</h3>" +
            hbars(
              top(chk).map(function (x) {
                return {
                  label: checkName(x[0]).name || x[0],
                  value: Math.round((100 * x[1]) / chkN[x[0]]),
                  color: "var(--c4)",
                };
              }),
              {
                fmt: function (v) {
                  return v + "%";
                },
              },
            ) +
            '<p class="small muted">% of reviews where the check did not pass.</p></div>';
          h +=
            '<div><h3>Hot spots</h3><div class="chips"><button class="chip on" data-hs="dirs">Folders</button><button class="chip" data-hs="files">Files</button></div><div id="hs-dirs">' +
            hbars(
              top(dirs).map(function (x) {
                return {
                  label: x[0],
                  html: "<code>" + esc(x[0]) + "</code>",
                  value: x[1],
                  color: "var(--c1)",
                };
              }),
            ) +
            '</div><div id="hs-files" class="hidden">' +
            hbars(
              top(files).map(function (x) {
                return {
                  label: x[0],
                  html: "<code>" + esc(x[0]) + "</code>",
                  value: x[1],
                  color: "var(--c1)",
                };
              }),
            ) +
            "</div></div>";
          h += "</div></div>";

          // --- Am I improving
          var tillReady = [];
          bs.forEach(function (b) {
            var rr = reviewRuns(b);
            for (var i = 0; i < rr.length; i++)
              if (rr[i].verdict === "ready") {
                tillReady.push({ label: b.branch, value: i + 1 });
                break;
              }
          });
          var avg = tillReady.length
            ? (
                tillReady.reduce(function (a, x) {
                  return a + x.value;
                }, 0) / tillReady.length
              ).toFixed(1)
            : "—";
          var closed = comments.filter(function (c) {
            return c.status !== "open";
          });
          var res = closed.filter(function (c) {
              return c.status === "resolved";
            }).length,
            dis = closed.filter(function (c) {
              return c.status === "dismissed";
            }).length,
            exc = closed.filter(function (c) {
              return c.status === "excepted";
            }).length;
          h +=
            '<div class="sec"><h2>Am I improving?</h2><h3>New findings per review over time</h3>' +
            legend(
              SEV.map(function (s) {
                return { name: SEV_LABEL[s], color: SEV_COLOR[s] };
              }),
            ) +
            columns(
              runs.map(function (r) {
                return {
                  label: r.branch + " #" + r.n + " · " + fmtDate(r.at),
                  short: day(r.at).slice(5),
                  segments: SEV.map(function (s) {
                    return {
                      name: s,
                      value: r.newBySev[s],
                      color: SEV_COLOR[s],
                    };
                  }),
                };
              }),
            );
          h +=
            '<div class="grid" style="margin-top:12px"><div><h3>Reviews until “ready to commit”</h3><div class="kpis">' +
            kpi("Average", avg) +
            "</div>" +
            hbars(
              tillReady
                .sort(function (a, b) {
                  return b.value - a.value;
                })
                .slice(0, 10)
                .map(function (x) {
                  return { label: x.label, value: x.value, color: "var(--c3)" };
                }),
            ) +
            "</div>";
          h +=
            "<div><h3>How comments were closed</h3>" +
            hbars([
              { label: "Resolved", value: res, color: "var(--ok)" },
              { label: "Dismissed", value: dis, color: "var(--c6)" },
              { label: "Excepted", value: exc, color: "var(--c5)" },
            ]) +
            '<p class="small muted">' +
            (closed.length
              ? Math.round((100 * dis) / closed.length) +
                "% dismissed. A high share suggests noisy reviews or a missing standard."
              : "No closed comments yet.") +
            "</p></div></div></div>";

          // --- Standards evolution
          var months = {};
          CRR.stdlog.forEach(function (l) {
            var m = String(l.at).slice(0, 7);
            months[m] = months[m] || {};
            months[m][l.action] = (months[m][l.action] || 0) + 1;
          });
          var acts = [
            "created",
            "updated",
            "activated",
            "deprecated",
            "rejected",
            "exception_added",
          ];
          var actColor = {
            created: "var(--c1)",
            updated: "var(--c2)",
            activated: "var(--c3)",
            deprecated: "var(--c4)",
            rejected: "var(--c6)",
            exception_added: "var(--c5)",
          };
          var excBy = {},
            excDir = {};
          CRR.standards.forEach(function (s) {
            (s.exceptions || []).forEach(function (e) {
              excBy[s.id] = (excBy[s.id] || 0) + 1;
              excDir[e.path] = (excDir[e.path] || 0) + 1;
            });
          });
          var migr = CRR.standards.filter(function (s) {
            return s.status === "deprecated";
          });
          h +=
            '<div class="sec"><h2>How are the standards evolving?</h2>' +
            legend(
              acts.map(function (a) {
                return { name: a.replace("_", " "), color: actColor[a] };
              }),
            ) +
            columns(
              Object.keys(months)
                .sort()
                .map(function (m) {
                  return {
                    label: m,
                    short: m,
                    segments: acts.map(function (a) {
                      return {
                        name: a,
                        value: months[m][a] || 0,
                        color: actColor[a],
                      };
                    }),
                  };
                }),
            );
          h +=
            '<div class="grid" style="margin-top:12px"><div><h3>Exceptions by standard</h3>' +
            hbars(
              top(excBy).map(function (x) {
                var s = stdById(x[0]);
                return {
                  label: x[0],
                  html:
                    '<a href="#/standards/' +
                    x[0] +
                    '">' +
                    x[0] +
                    "</a> " +
                    esc(s ? s.title : ""),
                  value: x[1],
                  color: "var(--c5)",
                };
              }),
            ) +
            "</div>";
          h +=
            "<div><h3>Exceptions by path</h3>" +
            hbars(
              top(excDir).map(function (x) {
                return {
                  label: x[0],
                  html: "<code>" + esc(x[0]) + "</code>",
                  value: x[1],
                  color: "var(--c5)",
                };
              }),
            ) +
            "</div>";
          h +=
            "<div><h3>Migrations in progress</h3>" +
            (migr.length
              ? migr
                  .map(function (s) {
                    var pts = CRR.stdlog
                      .filter(function (l) {
                        return (
                          l.standard === s.id &&
                          l.action === "migration_measured"
                        );
                      })
                      .sort(function (a, b) {
                        return logKey(a).localeCompare(logKey(b));
                      });
                    return (
                      '<div class="small" style="margin:6px 0"><a href="#/standards/' +
                      s.id +
                      '">' +
                      s.id +
                      "</a> " +
                      esc(s.title) +
                      " → " +
                      (s.migration
                        ? "<b>" + esc(s.migration.remaining) + "</b> left"
                        : '<span class="muted">not measured yet</span>') +
                      (pts.length > 1
                        ? '<div class="muted">' +
                          pts
                            .map(function (p) {
                              return (
                                day(p.at) +
                                ": " +
                                (p.details && p.details.remaining)
                              );
                            })
                            .join(" → ") +
                          "</div>"
                        : "") +
                      "</div>"
                    );
                  })
                  .join("")
              : '<p class="empty">No deprecated standards.</p>') +
            "</div></div></div>";
          return h;
        }
        function kpi(label, v) {
          return (
            '<div class="kpi"><span class="small muted">' +
            esc(label) +
            "</span><b>" +
            esc(v) +
            "</b></div>"

        function viewHelp() {

            "<h1>Help</h1><p class='small muted'>How to run, read and act on code reviews with the " +
            esc((CRR.local && CRR.local.repo) || "acanimal") +

          );
          h +=

          ].join("\n"));
          h +=
            '<p class="small muted">Modes: `auto` (incremental since the last review of the branch when possible), `full` (full re-review of pending changes) and `branch` (whole branch).</p>';
          h += "</div>";
          h += '<div class="sec"><h2>Reading the verdict</h2>';
          h += md([
            "Per branch, the panel shows a verdict:",
            "",
            "- ✓ **Ready to commit** — no open critical/major finding and no failing blocking check.",
            "- ✕ **Blocked** — open critical/major findings or a failing blocking check. Not ready to commit until they are fixed or properly dismissed.",
